/* ---------- un réseau qui apprend en direct ---------- */
VIZ.mlp = el => {
  const { body, ctrl, note } = vizShell(el, "Un réseau apprend une frontière courbe", "rétropropagation");
  const r = mulberry(4), data = [];
  for (let i = 0; i < 120; i++) { const a = r() * Math.PI, c = i % 2, x = c ? 1 - Math.cos(a) : Math.cos(a), y = c ? 0.5 - Math.sin(a) : Math.sin(a); data.push([Math.max(-1.33, Math.min(1.33, (x - 0.5) / 1.25 + gauss(r) * 0.08)), Math.max(-1.05, Math.min(1.05, (y - 0.25) / 1.25 + gauss(r) * 0.08)), c]); }
  const H = rangeCtl(ctrl, `mh${++vizUid}`, "Neurones cachés", 1, 16, 1, 8);
  const go = btnCtl(ctrl, "Entraîner", "btn small primary"), rst = btnCtl(ctrl, "Réinitialiser");
  let net, ep, loss, timer = null;
  const init = () => { const n = +H.value, rr = mulberry(1); net = { W1: Array.from({ length: 2 }, () => Array.from({ length: n }, () => gauss(rr) * 1.2)), b1: Array(n).fill(0), W2: Array.from({ length: n }, () => gauss(rr) * 0.8), b2: 0, n }; ep = 0; loss = null; };
  const fwd = (x, y) => { const h = net.b1.map((b, j) => Math.tanh(x * net.W1[0][j] + y * net.W1[1][j] + b)); const z = h.reduce((a, v, j) => a + v * net.W2[j], net.b2); return [h, 1 / (1 + Math.exp(-z))]; };
  const train = steps => {
    for (let s = 0; s < steps; s++) {
      const g = { W1: [Array(net.n).fill(0), Array(net.n).fill(0)], b1: Array(net.n).fill(0), W2: Array(net.n).fill(0), b2: 0 }; let L = 0;
      for (const [x, y, c] of data) { const [h, p] = fwd(x, y); L -= c ? Math.log(p + 1e-9) : Math.log(1 - p + 1e-9); const dz = (p - c) / data.length; g.b2 += dz; for (let j = 0; j < net.n; j++) { g.W2[j] += dz * h[j]; const dh = dz * net.W2[j] * (1 - h[j] * h[j]); g.W1[0][j] += dh * x; g.W1[1][j] += dh * y; g.b1[j] += dh; } }
      const lr = 1.0; net.b2 -= lr * g.b2; for (let j = 0; j < net.n; j++) { net.W2[j] -= lr * g.W2[j]; net.W1[0][j] -= lr * g.W1[0][j]; net.W1[1][j] -= lr * g.W1[1][j]; net.b1[j] -= lr * g.b1[j]; }
      loss = L / data.length; ep++;
    }
  };
  const draw = () => {
    const S = 26, X = v => 30 + (v + 1.4) / 2.8 * 540, Y = v => 260 - (v + 1.1) / 2.2 * 250;
    let svg = `<svg viewBox="0 0 600 270" shape-rendering="crispEdges">`;
    for (let i = 0; i < S; i++) for (let j = 0; j < S; j++) { const x = -1.4 + (i + .5) * 2.8 / S, y = -1.1 + (j + .5) * 2.2 / S, p = fwd(x, y)[1]; svg += `<rect x="${X(-1.4 + i * 2.8 / S)}" y="${Y(-1.1 + (j + 1) * 2.2 / S)}" width="${540 / S + 1}" height="${250 / S + 1}" class="${p > .5 ? "vz-mark" : "vz-accent"}" fill-opacity="${(0.08 + Math.abs(p - .5) * 0.5).toFixed(2)}"/>`; }
    svg += `<g shape-rendering="auto">`;
    data.forEach(([x, y, c]) => { svg += c ? `<rect x="${X(x) - 4}" y="${Y(y) - 4}" width="8" height="8" class="vz-mark" stroke="var(--ink)" stroke-width=".8"/>` : `<circle cx="${X(x)}" cy="${Y(y)}" r="4" class="vz-accent" stroke="var(--surface)" stroke-width=".8"/>`; });
    body.innerHTML = svg + "</g></svg>";
    const acc = data.filter(([x, y, c]) => (fwd(x, y)[1] > .5 ? 1 : 0) === c).length / data.length;
    note.innerHTML = `Époque <b>${ep}</b>${loss != null ? ` · perte <b>${loss.toFixed(3)}</b>` : ""} · exactitude <b>${(acc * 100).toFixed(0)} %</b>. Le fond montre la probabilité prédite en chaque point : à chaque époque, la rétropropagation déforme la frontière. ${+H.value <= 2 ? "Avec 1 ou 2 neurones cachés, la frontière reste presque droite." : ""}`;
  };
  go.addEventListener("click", () => { if (timer) { clearInterval(timer); timer = null; go.textContent = "Entraîner"; return; } go.textContent = "Pause"; timer = setInterval(() => { if (!el.isConnected || ep >= 3000) { clearInterval(timer); timer = null; go.textContent = "Entraîner"; return; } train(20); draw(); }, 60); });
  rst.addEventListener("click", () => { init(); draw(); }); H.addEventListener("change", () => { init(); draw(); });
  init(); draw();
};

  const K = { "Bord vertical": [[-1, 0, 1], [-1, 0, 1], [-1, 0, 1]], "Bord horizontal": [[-1, -1, -1], [0, 0, 0], [1, 1, 1]], "Flou": [[1, 1, 1], [1, 1, 1], [1, 1, 1]].map(r => r.map(v => v / 9)), "Netteté": [[0, -1, 0], [-1, 5, -1], [0, -1, 0]] };
  let kname = "Bord vertical", pos = 0, timer = null;

    svg += `<rect x="${10 + pj * cell - 1}" y="${20 + pi * cell - 1}" width="${3 * cell + 1}" height="${3 * cell + 1}" fill="none" class="vz-sacc" stroke-width="3"/>`;
    svg += `<text x="262" y="14" class="vz-tm">filtre 3 × 3</text>`;

    svg += `<text x="262" y="132" class="vz-tc">= ${O[pi][pj].toFixed(2)}</text>`;
    svg += `<text x="370" y="14" class="vz-tm">carte de sortie 8 × 8</text>`;
    O.forEach((r, i) => r.forEach((v, j) => { const done = i * n + j <= pos; svg += `<rect x="${370 + j * 27}" y="${20 + i * 27}" width="26" height="26" class="${v >= 0 ? "vz-accent" : "vz-err"}" fill-opacity="${done ? (0.08 + Math.abs(v) / mx * 0.92).toFixed(2) : 0.03}" ${i === pi && j === pj ? 'stroke="var(--ink)" stroke-width="2"' : ""}/>`; }));
    body.innerHTML = svg + "</svg>";
    note.innerHTML = `Position (${pi}, ${pj}) : on multiplie la zone encadrée par le filtre, terme à terme, et on additionne. ` + ({ "Bord vertical": "Ce filtre réagit aux changements de gauche à droite : bleu = passage du clair au foncé, rouge = l'inverse.", "Bord horizontal": "Ce filtre réagit aux changements de haut en bas.", "Flou": "Chaque pixel devient la moyenne de ses voisins.", "Netteté": "Le pixel central est renforcé par rapport à ses voisins." })[kname];

function attLogits(lien) {
  const n = ATT_TOK.length, L = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 1.2 : 0) + (j === i - 1 ? 0.6 : 0)));
  for (const [i, j, v] of lien) L[i][j] += v;
  return L;
}
const ATT_MAIN = attLogits([[1, 0, 1.2], [2, 1, 2.4], [5, 3, 1.6], [5, 4, 1.4], [6, 2, 1.8], [7, 1, 3.6], [8, 7, 2.2], [9, 7, 2.2], [9, 1, 2.0], [3, 2, 1.0], [4, 3, 0.4]]);
function attSoftmax(row, ok) { const z = row.map((v, j) => ok(j) ? v : -Infinity), m = Math.max(...z), e = z.map(v => v === -Infinity ? 0 : Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); }

/* ---------- attention : la matrice des poids ---------- */

  const causal = $("input", cb);
  ctrl.appendChild(h(`<span class="muted" style="font-size:13px">Touche un mot ou une ligne pour choisir la requête.</span>`));
  const draw = () => {
    const W = ATT_MAIN.map((row, i) => attSoftmax(row, j => !causal.checked || j <= i));

    let svg = `<svg viewBox="0 0 ${X0 + n * C + 8} ${Y0 + n * C + 8}" shape-rendering="crispEdges">`;

      for (let j = 0; j < n; j++) {

          : `<rect x="${X0 + j * C}" y="${Y0 + i * C}" width="${C}" height="${C}" class="vz-accent" fill-opacity="${(0.06 + 0.94 * Math.pow(w, 0.75)).toFixed(3)}" data-q="${i}" style="cursor:pointer"/>`;
        if (i === q && !masked) svg += `<text x="${X0 + j * C + C / 2}" y="${Y0 + i * C + C / 2 + 4}" text-anchor="middle" style="font:600 10px var(--mono);fill:var(--${w > 0.45 ? "surface" : "ink"})">${Math.round(w * 100)}</text>`;

    note.innerHTML = `Avec p = <b>${p.toFixed(2)}</b>, on garde <b>${n} candidat${n > 1 ? "s" : ""}</b> (probabilité cumulée ${(kept * 100).toFixed(0)} %), puis on renormalise. ${k === 0 ? "Quand le modèle est sûr, top-p garde très peu de mots : la réponse reste fiable." : "Quand le modèle hésite, top-p garde beaucoup de mots : le texte reste varié. Un top-k fixe ne s'adapterait pas."}`;

/* ---------- CLIP : matrice de similarités ---------- */
VIZ.clip = el => {
  const { body, ctrl, note } = vizShell(el, "La matrice de similarités de CLIP", "contrastif");
  const IM = [["chat", "M8 26 L14 8 L20 20 L28 20 L34 8 L40 26 Z"], ["voiture", "M4 30 L10 18 L36 18 L44 30 Z"], ["plage", "M2 34 Q24 24 46 34 Z"], ["pizza", "M24 6 L44 38 L4 38 Z"]];
  const TX = ["un chat qui dort", "une voiture rouge", "une plage au soleil", "une pizza maison"];
  const r = mulberry(12), S0 = IM.map(() => TX.map(() => (r() - 0.5) * 0.5));
  let prog = 0, timer = null;
  const T = rangeCtl(ctrl, `ct${++vizUid}`, "Température τ", 0.02, 1, 0.01, 0.1, v => v.toFixed(2));
  const go = btnCtl(ctrl, "Entraîner", "btn small primary"), rst = btnCtl(ctrl, "Réinitialiser");
  const sim = () => S0.map((row, i) => row.map((v, j) => (1 - prog) * v + prog * (i === j ? 0.82 : -0.05 + 0.1 * ((i + j) % 3) / 2)));
  const draw = () => {
    const S = sim(), tau = +T.value;
    const P = S.map(row => { const z = row.map(v => v / tau), m = Math.max(...z), e = z.map(v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); });
    const loss = -P.reduce((a, row, i) => a + Math.log(row[i]), 0) / 4;
    const C = 92, X0 = 100, Y0 = 70;
    let svg = `<svg viewBox="0 0 ${X0 + 4 * C + 10} ${Y0 + 4 * C + 10}">`;
    TX.forEach((t, j) => { const words = t.split(" "); svg += `<text x="${X0 + j * C + C / 2}" y="${Y0 - 34}" text-anchor="middle" class="vz-tm">${words.slice(0, 2).join(" ")}</text><text x="${X0 + j * C + C / 2}" y="${Y0 - 20}" text-anchor="middle" class="vz-tm">${words.slice(2).join(" ")}</text>`; });
    IM.forEach(([nom, d], i) => { svg += `<g transform="translate(${18} ${Y0 + i * C + 18}) scale(1.1)"><rect x="0" y="0" width="48" height="44" rx="6" class="vz-code" stroke="var(--line)"/><path d="${d}" class="vz-mark"/></g><text x="${44}" y="${Y0 + i * C + 82}" text-anchor="middle" class="vz-tm">${nom}</text>`; });
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      const p = P[i][j];
      svg += `<rect x="${X0 + j * C + 2}" y="${Y0 + i * C + 2}" width="${C - 4}" height="${C - 4}" rx="8" class="${i === j ? "vz-ok" : "vz-accent"}" fill-opacity="${(0.08 + 0.92 * p).toFixed(3)}"${i === j ? ` stroke="var(--ok)" stroke-width="2"` : ""}/>`;
      svg += `<text x="${X0 + j * C + C / 2}" y="${Y0 + i * C + C / 2 - 2}" text-anchor="middle" style="font:600 14px var(--mono);fill:var(--${p > 0.55 ? "surface" : "ink"})">${S[i][j].toFixed(2)}</text><text x="${X0 + j * C + C / 2}" y="${Y0 + i * C + C / 2 + 16}" text-anchor="middle" style="font:11px var(--mono);fill:var(--${p > 0.55 ? "surface" : "muted"})">${Math.round(p * 100)} %</text>`;
    }
    body.innerHTML = svg + "</svg>";
    const ok = P.filter((row, i) => row.indexOf(Math.max(...row)) === i).length;
    note.innerHTML = `Chaque case montre la similarité cosinus et, dessous, la probabilité après softmax de la ligne (divisée par τ). Perte : <b>${loss.toFixed(3)}</b> · bonnes paires retrouvées : <b>${ok}/4</b>. ${prog < 0.05 ? "Avant l'entraînement, les similarités sont aléatoires." : prog >= 1 ? "La diagonale (les bonnes paires) domine : l'image et sa légende sont proches dans l'espace commun." : "L'entraînement rapproche chaque image de sa légende et l'éloigne des autres."} Baisse τ : le softmax tranche davantage.`;
  };
  go.addEventListener("click", () => { if (timer) return; timer = setInterval(() => { if (!el.isConnected) { clearInterval(timer); timer = null; return; } prog = Math.min(1, prog + 0.04); draw(); if (prog >= 1) { clearInterval(timer); timer = null; } }, 50); });
  rst.addEventListener("click", () => { if (timer) { clearInterval(timer); timer = null; } prog = 0; draw(); });
  T.addEventListener("input", draw); draw();
};

/* ---------- diffusion en 2D ---------- */
VIZ.diffusion = el => {
  const { body, ctrl, note } = vizShell(el, "Bruiter, puis débruiter", "diffusion");
  const r = mulberry(21), N = 260, Tn = 100;
  const data = Array.from({ length: N }, () => { const a = 0.5 + r() * 3.5 * Math.PI; return [a * Math.cos(a) / 6, a * Math.sin(a) / 6]; });
  const eps = data.map(() => [gauss(r), gauss(r)]);
  const betas = Array.from({ length: Tn }, (_, i) => 1e-3 + (0.1 - 1e-3) * i / (Tn - 1)), abar = []; betas.reduce((a, b, i) => (abar[i] = a * (1 - b)), 1);
  const T = rangeCtl(ctrl, `dt${++vizUid}`, "Instant t", 0, Tn, 1, 0);
  const gen = btnCtl(ctrl, "Générer depuis le bruit", "btn small primary");
  let pts = null, mode = "avant", timer = null, tcur = 0;
  const forward = t => t === 0 ? data : data.map((x, i) => [Math.sqrt(abar[t - 1]) * x[0] + Math.sqrt(1 - abar[t - 1]) * eps[i][0], Math.sqrt(abar[t - 1]) * x[1] + Math.sqrt(1 - abar[t - 1]) * eps[i][1]]);
  const epsOpt = (x, t) => { const sa = Math.sqrt(abar[t]), v = 2 * (1 - abar[t]); let wmax = -Infinity; const lw = data.map(d => { const a = -((x[0] - sa * d[0]) ** 2 + (x[1] - sa * d[1]) ** 2) / v; if (a > wmax) wmax = a; return a; }); let s = 0, m0 = 0, m1 = 0; lw.forEach((a, i) => { const w = Math.exp(a - wmax); s += w; m0 += w * data[i][0]; m1 += w * data[i][1]; }); return [(x[0] - sa * m0 / s) / Math.sqrt(1 - abar[t]), (x[1] - sa * m1 / s) / Math.sqrt(1 - abar[t])]; };
  const draw = () => {
    const P = mode === "avant" ? forward(+T.value) : pts, X = v => 300 + v * 110, Y = v => 150 - v * 66;
    let svg = `<svg viewBox="0 0 600 300"><rect x="0" y="0" width="600" height="300" rx="10" class="vz-code"/>`;
    data.forEach(([a, b]) => { svg += `<circle cx="${X(a)}" cy="${Y(b)}" r="2" class="vz-muted" fill-opacity=".25"/>`; });
    P.forEach(([a, b]) => { if (Math.abs(a) < 2.7 && Math.abs(b) < 2.2) svg += `<circle cx="${X(a)}" cy="${Y(b)}" r="2.6" class="${mode === "avant" ? "vz-accent" : "vz-ok"}"/>`; });
    body.innerHTML = svg + "</svg>";
    const t = mode === "avant" ? +T.value : tcur, ab = t === 0 ? 1 : abar[t - 1];
    note.innerHTML = mode === "avant"
      ? `Processus vers l'avant à t = <b>${t}</b> : ᾱ = <b>${ab.toFixed(3)}</b>, il reste ${Math.round(Math.sqrt(ab) * 100)} % du signal. En gris, les données d'origine (une spirale). Pousse t à 100 : il ne reste que du bruit.`
      : `Processus inverse, étape t = <b>${t}</b>. On part de 260 points de bruit pur ; à chaque étape, on retire le bruit prédit et on rajoute un peu de hasard. Les points se rassemblent sur la spirale.`;
  };
  T.addEventListener("input", () => { if (timer) { clearInterval(timer); timer = null; } mode = "avant"; draw(); });
  gen.addEventListener("click", () => {
    if (timer) clearInterval(timer);
    const rr = mulberry(Date.now() % 100000); pts = data.map(() => [gauss(rr), gauss(rr)]); tcur = Tn; mode = "arriere";
    timer = setInterval(() => {
      if (!el.isConnected) { clearInterval(timer); timer = null; return; }
      for (let k = 0; k < 2 && tcur > 0; k++) {
        const t = tcur - 1;
        pts = pts.map(x => { const e = epsOpt(x, t), c = betas[t] / Math.sqrt(1 - abar[t]), s = Math.sqrt(1 - betas[t]); const m = [(x[0] - c * e[0]) / s, (x[1] - c * e[1]) / s]; return t > 0 ? [m[0] + Math.sqrt(betas[t]) * gauss(rr), m[1] + Math.sqrt(betas[t]) * gauss(rr)] : m; });
        tcur = t;
      }
      draw(); if (tcur <= 0) { clearInterval(timer); timer = null; }
    }, 40);
  });
  draw();
};

/* ---------- Q-learning sur une grille ---------- */
VIZ.qlearn = el => {
  const { body, ctrl, note } = vizShell(el, "Un agent apprend à traverser une grille", "Q-learning");
  const G = 5, GOAL = [4, 4], TRAPS = ["2,1", "1,3", "3,3"], WALLS = ["2,2", "3,1"];
  const MV = [[0, -1], [1, 0], [0, 1], [-1, 0]], ARR = ["↑", "→", "↓", "←"];
  const E = rangeCtl(ctrl, `qe${++vizUid}`, "Exploration ε", 0, 0.5, 0.05, 0.2, v => v.toFixed(2));
  const go = btnCtl(ctrl, "Entraîner 25 épisodes", "btn small primary"), rst = btnCtl(ctrl, "Réinitialiser");
  let Q, ep, rr;
  const init = () => { Q = Array.from({ length: G * G }, () => [0, 0, 0, 0]); ep = 0; rr = mulberry(5); };
  const step = (x, y, a) => { let nx = Math.min(G - 1, Math.max(0, x + MV[a][0])), ny = Math.min(G - 1, Math.max(0, y + MV[a][1])); if (WALLS.includes(`${nx},${ny}`)) { nx = x; ny = y; } const k = `${nx},${ny}`; if (nx === GOAL[0] && ny === GOAL[1]) return [nx, ny, 1, true]; if (TRAPS.includes(k)) return [nx, ny, -1, true]; return [nx, ny, -0.02, false]; };
  const episode = () => {
    let x = 0, y = 0;
    for (let s = 0; s < 60; s++) {
      const q = Q[y * G + x], best = Math.max(...q), a = rr() < +E.value || q.every(v => v === q[0]) ? Math.floor(rr() * 4) : q.indexOf(best);
      const [nx, ny, rw, done] = step(x, y, a), tgt = done ? rw : rw + 0.9 * Math.max(...Q[ny * G + nx]);
      Q[y * G + x][a] += 0.5 * (tgt - Q[y * G + x][a]); x = nx; y = ny; if (done) break;
    }
    ep++;
  };
  const greedy = () => { let x = 0, y = 0; const p = [[0, 0]]; for (let s = 0; s < 20; s++) { const q = Q[y * G + x]; if (q.every(v => v === 0)) break; const [nx, ny, , done] = step(x, y, q.indexOf(Math.max(...q))); x = nx; y = ny; p.push([x, y]); if (done) break; } return p; };
  const draw = () => {
    const C = 52, X0 = 170, Y0 = 8;
    let svg = `<svg viewBox="0 0 600 ${G * C + 16}">`;
    for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) {
      const k = `${x},${y}`, v = Math.max(...Q[y * G + x]), px = X0 + x * C, py = Y0 + y * C, goal = x === GOAL[0] && y === GOAL[1];
      const cls = WALLS.includes(k) ? "vz-muted" : TRAPS.includes(k) ? "vz-err" : goal || v >= 0 ? "vz-ok" : "vz-err";
      const op = WALLS.includes(k) ? 0.5 : TRAPS.includes(k) || goal ? 0.9 : Math.min(0.75, Math.abs(v) * 0.9);
      svg += `<rect x="${px + 1}" y="${py + 1}" width="${C - 2}" height="${C - 2}" rx="6" class="${cls}" fill-opacity="${op.toFixed(2)}" stroke="var(--line)"/>`;
      if (TRAPS.includes(k) || goal) svg += `<text x="${px + C / 2}" y="${py + C / 2 + 5}" text-anchor="middle" style="font:600 13px var(--mono);fill:var(--surface)">${goal ? "+1" : "−1"}</text>`;
      else if (!WALLS.includes(k) && Q[y * G + x].some(q => q !== 0)) svg += `<text x="${px + C / 2}" y="${py + C / 2 + 7}" text-anchor="middle" style="font:600 20px var(--body);fill:var(--ink)">${ARR[Q[y * G + x].indexOf(Math.max(...Q[y * G + x]))]}</text>`;
    }
    const g = greedy();
    svg += `<polyline points="${g.map(([x, y]) => `${X0 + x * C + C / 2},${Y0 + y * C + C / 2}`).join(" ")}" fill="none" class="vz-sacc" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>`;
    svg += `<circle cx="${X0 + C / 2}" cy="${Y0 + C / 2}" r="8" class="vz-mark" stroke="var(--ink)"/></svg>`;
    body.innerHTML = svg;
    const fin = g[g.length - 1], reussi = fin[0] === GOAL[0] && fin[1] === GOAL[1];
    note.innerHTML = `Épisodes : <b>${ep}</b>. Le point jaune est le départ, la case verte « +1 » l'arrivée, les cases rouges « −1 » des pièges, les grises des murs. Chaque pas coûte −0,02. Les flèches montrent l'action de plus grande valeur Q dans chaque case, le pointillé le chemin glouton. ${ep === 0 ? "Lance l'entraînement." : reussi ? `L'agent a trouvé un chemin en <b>${g.length - 1} pas</b> sans tomber dans un piège.` : "L'agent n'a pas encore trouvé de chemin fiable : continue l'entraînement."}`;
  };
  go.addEventListener("click", () => { let n = 0; const t = setInterval(() => { if (!el.isConnected || n >= 25) { clearInterval(t); return; } episode(); n++; draw(); }, 35); });
  rst.addEventListener("click", () => { init(); draw(); });
  init(); draw();
};

/* ================================================================ vague 6 : ingénierie ML et IA */
const VZ_COL = ["var(--accent)", "var(--mark)", "var(--ok)", "var(--err)", "#8b5cf6", "#0e8a9a", "#c2410c", "#64748b"];

/* ---------- asynchrone : séquentiel, concurrent, sémaphore ---------- */
VIZ.async = el => {
  const { body, ctrl, note } = vizShell(el, "Attendre l'un après l'autre, ou en même temps", "asyncio");
  const T = [["LLM : résumé", 1.2], ["Base de données", 0.4], ["API météo", 0.8], ["LLM : traduction", 1.0], ["Recherche vectorielle", 0.3]];
  const MODES = [["seq", "Séquentiel"], ["gather", "asyncio.gather"], ["sem", "Sémaphore (2)"]];
  let mode = "seq", t = 0, timer = null;
  const btns = MODES.map(([k, lab]) => { const b = btnCtl(ctrl, lab); b.addEventListener("click", () => { mode = k; t = 0; play(); }); return b; });
  const plan = () => {
    if (mode === "seq") { let s = 0; return T.map(([n, d]) => { const r = [n, s, d]; s += d; return r; }); }
    if (mode === "gather") return T.map(([n, d]) => [n, 0, d]);
    const libres = [0, 0]; return T.map(([n, d]) => { const i = libres[0] <= libres[1] ? 0 : 1, s = libres[i]; libres[i] = s + d; return [n, s, d]; });
  };
  const draw = () => {
    btns.forEach((b, i) => b.className = `btn small${MODES[i][0] === mode ? " primary" : ""}`);
    const P = plan(), total = Math.max(...P.map(([, s, d]) => s + d)), X = v => 170 + v / 3.8 * 410;
    let svg = `<svg viewBox="0 0 600 ${T.length * 34 + 46}">`;
    for (let k = 0; k <= 3.5; k += 0.5) svg += `<line x1="${X(k)}" y1="6" x2="${X(k)}" y2="${T.length * 34 + 12}" class="vz-line"/><text x="${X(k)}" y="${T.length * 34 + 28}" text-anchor="middle" class="vz-tm">${k} s</text>`;
    P.forEach(([n, s, d], i) => {
      const y = 12 + i * 34, w = Math.max(0, Math.min(d, t - s)) / 3.8 * 410;
      svg += `<text x="160" y="${y + 17}" text-anchor="end" style="font:14px var(--body);fill:var(--ink)">${n}</text><rect x="${X(s)}" y="${y}" width="${d / 3.8 * 410}" height="22" rx="5" class="vz-muted" fill-opacity=".18"/>`;
      if (w > 0) svg += `<rect x="${X(s)}" y="${y}" width="${w}" height="22" rx="5" style="fill:${VZ_COL[i]}" fill-opacity=".85"/>`;
    });
    svg += `<line x1="${X(Math.min(t, total))}" y1="2" x2="${X(Math.min(t, total))}" y2="${T.length * 34 + 14}" class="vz-sink" stroke-width="2"/></svg>`;
    body.innerHTML = svg;
    const txt = { seq: "Chaque appel attend la fin du précédent : les temps s'additionnent.", gather: "Tous les appels partent en même temps : on attend seulement le plus long.", sem: "Au plus 2 appels à la fois : un compromis pour respecter les limites d'une API (erreurs 429)." }[mode];
    note.innerHTML = `Durée totale : <b>${total.toFixed(1)} s</b>${t >= total ? "" : ` · t = ${t.toFixed(1)} s`}. ${txt} Pendant l'attente, le processeur est libre : c'est ce temps que l'asynchrone récupère.`;
  };
  const play = () => { if (timer) clearInterval(timer); const total = Math.max(...plan().map(([, s, d]) => s + d)); timer = setInterval(() => { if (!el.isConnected) { clearInterval(timer); return; } t = Math.min(total, t + 0.05); draw(); if (t >= total) { clearInterval(timer); timer = null; } }, 30); };
  t = 99; draw();
};

    note.innerHTML = `Étape ${k + 1}/${STEPS.length} · nœud <b>${cur}</b>. ${STEPS[k].txt}`;

/* ---------- vLLM : batching statique contre continu ---------- */
VIZ.batching = el => {
  const { body, ctrl, note } = vizShell(el, "Batching statique contre continu", "inférence");
  const L = [6, 22, 4, 9, 20, 3, 5, 7, 4, 12, 3, 6], B = 4;
  let mode = "statique", t = 0, timer = null;
  const b1 = btnCtl(ctrl, "Statique"), b2 = btnCtl(ctrl, "Continu (vLLM)"), go = btnCtl(ctrl, "Lancer", "btn small primary");
  const sim = () => {
    const slots = Array.from({ length: B }, () => []);
    if (mode === "statique") { let s = 0; for (let i = 0; i < L.length; i += B) { const lot = L.slice(i, i + B), m = Math.max(...lot); lot.forEach((l, j) => slots[j].push([i + j, s, l])); s += m; } return [slots, s]; }
    const fin = Array(B).fill(0); L.forEach((l, i) => { let j = 0; for (let k = 1; k < B; k++) if (fin[k] < fin[j]) j = k; slots[j].push([i, fin[j], l]); fin[j] += l; }); return [slots, Math.max(...fin)];
  };
  const draw = () => {
    b1.className = `btn small${mode === "statique" ? " primary" : ""}`; b2.className = `btn small${mode === "continu" ? " primary" : ""}`;
    const [slots, total] = sim(), X = v => 70 + v * 9.2;
    let svg = `<svg viewBox="0 0 600 ${B * 34 + 40}">`;
    slots.forEach((row, j) => {
      const y = 8 + j * 34;
      svg += `<text x="60" y="${y + 17}" text-anchor="end" class="vz-tm">place ${j + 1}</text><rect x="${X(0)}" y="${y}" width="${X(total) - X(0)}" height="24" rx="4" class="vz-muted" fill-opacity=".12"/>`;
      row.forEach(([i, s, l]) => { const w = Math.max(0, Math.min(l, t - s)); if (w > 0) svg += `<rect x="${X(s) + 1}" y="${y}" width="${w * 9.2 - 2}" height="24" rx="4" style="fill:${VZ_COL[i % VZ_COL.length]}" fill-opacity=".85"/>${w === l ? `<text x="${X(s) + l * 4.6}" y="${y + 16}" text-anchor="middle" style="font:600 10px var(--mono);fill:var(--surface)">R${i + 1}</text>` : ""}`; });
    });
    svg += `<line x1="${X(Math.min(t, total))}" y1="2" x2="${X(Math.min(t, total))}" y2="${B * 34 + 8}" class="vz-sink" stroke-width="2"/><text x="${X(0)}" y="${B * 34 + 28}" class="vz-tm">pas de décodage →</text></svg>`;
    body.innerHTML = svg;
    const util = L.reduce((a, b) => a + b, 0) / (total * B);
    note.innerHTML = `12 requêtes, 4 places sur le GPU. Total : <b>${total} pas</b>, taux d'occupation <b>${Math.round(util * 100)} %</b>. ${mode === "statique" ? "En statique, un lot attend sa requête la plus longue : les places des requêtes finies restent vides (zones grises)." : "En continu, une place libérée est reprise au pas suivant : le GPU reste plein, et les requêtes courtes n'attendent pas les longues."}`;
  };
  const play = () => { if (timer) clearInterval(timer); t = 0; const total = sim()[1]; timer = setInterval(() => { if (!el.isConnected) { clearInterval(timer); return; } t = Math.min(total, t + 0.5); draw(); if (t >= total) { clearInterval(timer); timer = null; } }, 30); };

/* ---------- Kubernetes : l'autoscaler ---------- */
VIZ.hpa = el => {
  const { body, ctrl, note } = vizShell(el, "L'autoscaler ajoute et retire des pods", "Kubernetes");
  const Q = rangeCtl(ctrl, `hq${++vizUid}`, "Requêtes par seconde", 50, 1200, 10, 300, v => v);
  let pods = 2, hist = [];
  const CAP = 100, CIBLE = 0.6;
  const step = () => {
    const charge = +Q.value / (pods * CAP), voulu = Math.abs(charge / CIBLE - 1) <= 0.1 ? pods : Math.ceil(pods * charge / CIBLE);
    pods = Math.max(1, Math.min(16, voulu));
    hist.push([+Q.value, pods, Math.min(1.5, +Q.value / (pods * CAP))]); if (hist.length > 40) hist.shift();
  };
  const draw = () => {
    const charge = +Q.value / (pods * CAP);
    let svg = `<svg viewBox="0 0 600 210">`;
    for (let i = 0; i < 16; i++) { const x = 20 + (i % 8) * 46, y = 16 + Math.floor(i / 8) * 54, on = i < pods; svg += `<rect x="${x}" y="${y}" width="38" height="42" rx="7" class="${on ? (charge > 0.9 ? "vz-err" : "vz-ok") : "vz-code"}" fill-opacity="${on ? .85 : 1}" stroke="var(--line)"/>${on ? `<text x="${x + 19}" y="${y + 26}" text-anchor="middle" style="font:600 11px var(--mono);fill:var(--surface)">pod</text>` : ""}`; }
    svg += `<text x="410" y="40" class="vz-tb">${pods} pod${pods > 1 ? "s" : ""}</text><text x="410" y="62" class="vz-tm">CPU moyen : ${Math.round(Math.min(charge, 1.5) * 100)} %</text><text x="410" y="80" class="vz-tm">cible : 60 %</text>`;
    const X = i => 20 + i * 14, Y = v => 200 - v * 60;
    svg += `<line x1="20" y1="${Y(CIBLE)}" x2="580" y2="${Y(CIBLE)}" class="vz-smuted" stroke-dasharray="4 4"/>`;
    if (hist.length > 1) svg += `<polyline points="${hist.map((h, i) => `${X(i)},${Y(h[2])}`).join(" ")}" fill="none" class="vz-sacc" stroke-width="2"/>`;
    body.innerHTML = svg + "</svg>";
    note.innerHTML = `Chaque pod absorbe environ ${CAP} requêtes par seconde. Toutes les 15 secondes (ici, toutes les 0,7 s), l'autoscaler calcule ⌈pods × CPU mesuré / CPU cible⌉. Monte la charge : il ajoute des pods jusqu'à revenir près de 60 %. La courbe bleue montre le CPU moyen dans le temps.`;
  };
  const timer = setInterval(() => { if (!el.isConnected) { clearInterval(timer); return; } step(); draw(); }, 700);
  Q.addEventListener("input", draw); step(); draw();
};

VIZ.dagrun = el => {
  const { body, ctrl, note } = vizShell(el, "Une exécution de DAG, avec reprise", "Airflow");
  const T = [["extraire", 70, 60, []], ["controler", 220, 60, ["extraire"]], ["variables", 370, 30, ["controler"]], ["rapport_qualite", 370, 100, ["controler"]], ["entrainer", 520, 30, ["variables"]], ["publier", 520, 100, ["entrainer"]]];
  const SC = [{ nom: "Tout va bien", echec: null }, { nom: "Panne passagère", echec: ["extraire", 1] }, { nom: "Données invalides", echec: ["controler", 9] }];
  let sc = 0, etapes = [], k = 0, timer = null;
  const sel = h(`<label for="dg${++vizUid}">Scénario <select id="dg${vizUid}" class="btn small">${SC.map((s, i) => `<option value="${i}">${s.nom}</option>`).join("")}</select></label>`); ctrl.appendChild(sel);
  const go = btnCtl(ctrl, "Lancer", "btn small primary");
  const simuler = () => {
    const st = {}, ev = [], [tf, n] = SC[sc].echec || [null, 0];
    const pret = t => t[3].every(d => st[d]);
    while (Object.keys(st).length < T.length) {
      const t = T.find(t => !st[t[0]] && pret(t));
      if (t[3].some(d => st[d] !== "success")) { st[t[0]] = "upstream_failed"; ev.push([t[0], "upstream_failed"]); continue; }
      let ok = false;
      for (let a = 0; a < 3; a++) { ev.push([t[0], "running"]); if (t[0] === tf && a < n) { ev.push([t[0], a < 2 ? "up_for_retry" : "failed"]); continue; } ok = true; break; }
      st[t[0]] = ok ? "success" : "failed"; ev.push([t[0], st[t[0]]]);
    }
    return ev;
  };
  const COL = { success: "var(--ok)", running: "var(--accent)", up_for_retry: "var(--mark)", failed: "var(--err)", upstream_failed: "#c2410c" };
  const draw = () => {
    const st = {}; etapes.slice(0, k).forEach(([t, s]) => st[t] = s);
    let svg = `<svg viewBox="0 0 600 140"><defs><marker id="dm${vizUid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--muted)"/></marker></defs>`;
    T.forEach(([n, x, y, deps]) => deps.forEach(d => { const [, x0, y0] = T.find(t => t[0] === d); svg += `<line x1="${x0 + 52}" y1="${y0}" x2="${x - 54}" y2="${y}" class="vz-smuted" stroke-width="1.5" marker-end="url(#dm${vizUid})"/>`; }));
    T.forEach(([n, x, y]) => { const s = st[n]; svg += `<rect x="${x - 52}" y="${y - 16}" width="104" height="32" rx="8" style="fill:${s ? COL[s] : "var(--code-bg)"}" stroke="var(--line)"/><text x="${x}" y="${y + 4}" text-anchor="middle" style="font:600 11px var(--mono);fill:var(--${s ? "surface" : "ink"})">${n}</text>`; });
    body.innerHTML = svg + `</svg><p style="font-size:12.5px;margin:6px 0 0">${Object.entries(COL).map(([k, c]) => `<span style="color:${c}">■</span> ${k}`).join(" · ")}</p>`;
    const last = etapes[k - 1];
    note.innerHTML = !k ? "Choisis un scénario et lance l'exécution." : k < etapes.length ? `<b>${last[0]}</b> → ${last[1]}` : sc === 0 ? "Toutes les tâches ont réussi." : sc === 1 ? "La base était indisponible au premier essai : Airflow a relancé « extraire » (retries), puis tout s'est bien passé." : "Le contrôle de qualité échoue même après les reprises : rien n'est entraîné ni publié avec des données invalides (upstream_failed). C'est voulu.";
  };
  go.addEventListener("click", () => { if (timer) clearInterval(timer); etapes = simuler(); k = 0; timer = setInterval(() => { if (!el.isConnected || k >= etapes.length) { clearInterval(timer); timer = null; return; } k++; draw(); }, 380); });
  $("select", sel).addEventListener("change", e => { sc = +e.target.value; etapes = []; k = 0; draw(); });
  draw();
};

/* ---------- dérive : deux distributions et le PSI ---------- */
VIZ.drift = el => {
  const { body, ctrl, note } = vizShell(el, "Mesurer la dérive d'une variable", "PSI");
  const D = rangeCtl(ctrl, `dd${++vizUid}`, "Décalage de la moyenne", 0, 1.5, 0.05, 0.3, v => v.toFixed(2));
  const S = rangeCtl(ctrl, `ds${vizUid}`, "Étalement", 0.6, 1.8, 0.05, 1, v => "× " + v.toFixed(2));
  const r = mulberry(8), ref = Array.from({ length: 4000 }, () => gauss(r)), z = Array.from({ length: 4000 }, () => gauss(r));
  const q = [...ref].sort((a, b) => a - b), bords = [-Infinity, ...Array.from({ length: 9 }, (_, i) => q[Math.floor((i + 1) * 400)]), Infinity];
  const draw = () => {
    const act = z.map(v => +D.value + v * +S.value);
    const prop = arr => { const c = Array(10).fill(0); arr.forEach(v => { let i = 0; while (v >= bords[i + 1]) i++; c[i]++; }); return c.map(x => Math.max(x / arr.length, 1e-4)); };
    const pr = prop(ref), pa = prop(act), psi = pr.reduce((s, p, i) => s + (pa[i] - p) * Math.log(pa[i] / p), 0);
    let svg = `<svg viewBox="0 0 600 230">`;
    const W = 52;
    pr.forEach((p, i) => { const x = 30 + i * 55; svg += `<rect x="${x}" y="${190 - p * 600}" width="${W / 2 - 2}" height="${p * 600}" class="vz-muted" fill-opacity=".55"/><rect x="${x + W / 2}" y="${190 - pa[i] * 600}" width="${W / 2 - 2}" height="${pa[i] * 600}" class="${psi > 0.2 ? "vz-err" : psi > 0.1 ? "vz-mark" : "vz-accent"}"/>`; });
    svg += `<line x1="26" y1="190" x2="580" y2="190" class="vz-line"/><line x1="30" y1="${190 - 60}" x2="580" y2="${190 - 60}" class="vz-smuted" stroke-dasharray="3 4"/><text x="578" y="${190 - 66}" text-anchor="end" class="vz-tm">10 %</text>`;
    svg += `<text x="300" y="214" text-anchor="middle" class="vz-tm">10 intervalles de même effectif dans la référence (gris) · période actuelle (couleur)</text></svg>`;
    body.innerHTML = svg;
    note.innerHTML = `PSI = <b>${psi.toFixed(3)}</b> : ${psi < 0.1 ? "distribution stable." : psi < 0.2 ? "dérive modérée, à surveiller." : "dérive importante : enquêter, et sans doute réentraîner."} Dans la référence, chaque intervalle contient 10 % des valeurs ; la dérive se voit quand les barres colorées s'écartent de ce niveau.`;
  };
  D.addEventListener("input", draw); S.addEventListener("input", draw); draw();
};

"use strict";
/* ================================================================ utilitaires */

/* ================================================================ contenu */
let C = null;
const MOD = {};        // id module -> { module, track }
const HOME = {};       // id item/quiz -> id module de rattachement
const ORDER = [];      // parcours ordonné d'items et de quiz (sans doublons)
const ITEM = id => (C.items[id] || C.quizzes[id] || null);

function indexContent() {
  const seen = new Set();
  const push = (id, mid) => { if (!seen.has(id)) { seen.add(id); ORDER.push(id); HOME[id] = mid; } };
  for (const T of C.tracks) for (const M of T.modules) {
    MOD[M.id] = { M, T };
    for (const s of M.sections) for (const id of s.lecons) push(id, M.id);
    for (const id of M.projets) push(id, M.id);
    for (const id of M.quiz) push(id, M.id);
  }
}
function moduleItems(M) {
  const ids = [];
  for (const s of M.sections) for (const id of s.lecons) if (!ids.includes(id)) ids.push(id);
  for (const id of M.projets) if (!ids.includes(id)) ids.push(id);
  for (const id of M.quiz) if (!ids.includes(id)) ids.push(id);
  return ids;
}

/* ================================================================ progression */
const LS_KEY = "mise-a-niveau-ia:v1";
const LS_CODE = "mise-a-niveau-ia:code:v1";
const blank = () => ({ v: 1, done: {}, ex: {}, tasks: {}, quiz: {}, days: [], start: null, track: "essentials", week: null });
let S = blank();
let CODE = {};
const store = { ref: null, codeRef: null, mode: "local", timer: null, codeTimer: null, writing: false, again: false, codeWriting: false, codeAgain: false };

function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && s.v === 1) S = Object.assign(blank(), s); } catch (e) {}
  try { CODE = JSON.parse(localStorage.getItem(LS_CODE) || "{}") || {}; } catch (e) {}
}
function merge(a, b) {
  const m = blank();
  for (const k of ["done", "ex", "tasks"]) m[k] = Object.assign({}, a[k], b[k]);
  for (const k of new Set([...Object.keys(a.quiz || {}), ...Object.keys(b.quiz || {})])) m.quiz[k] = Math.max(a.quiz?.[k] ?? 0, b.quiz?.[k] ?? 0);
  m.days = [...new Set([...(a.days || []), ...(b.days || [])])].sort();
  m.start = b.start || a.start || null;
  m.track = b.track || a.track || "essentials";
  m.week = b.week ?? a.week ?? null;
  return m;
}
function touchDay() { const d = today(); if (!S.days.includes(d)) S.days.push(d); }
function save() {
  touchDay();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  updateGlobal();
  if (store.ref) { clearTimeout(store.timer); store.timer = setTimeout(pushRemote, 1200); }
}
async function pushRemote() {
  if (!store.ref) return;
  if (store.writing) { store.again = true; return; }
  store.writing = true;
  try { await store.ref.set(JSON.parse(JSON.stringify(S))); setSync("compte"); }
  catch (e) { if (e && ["invalid_argument", "revoked", "not_granted"].includes(e.code)) { store.ref = null; store.codeRef = null; setSync("local"); } }
  store.writing = false;
  if (store.again) { store.again = false; pushRemote(); }
}
function saveCode(id, code) {
  CODE[id] = code;
  try { localStorage.setItem(LS_CODE, JSON.stringify(CODE)); } catch (e) {}
  if (store.codeRef) { clearTimeout(store.codeTimer); store.codeTimer = setTimeout(pushCode, 2500); }
}
async function pushCode() {
  if (!store.codeRef) return;
  if (store.codeWriting) { store.codeAgain = true; return; }
  store.codeWriting = true;
  try { await store.codeRef.set(JSON.parse(JSON.stringify({ code: CODE }))); } catch (e) {}
  store.codeWriting = false;
  if (store.codeAgain) { store.codeAgain = false; pushCode(); }
}
function setSync(mode) {
  store.mode = mode;
  const el = $("#sync");
  if (el) el.textContent = mode === "compte" ? "Ta progression et ton code sont enregistrés sur ton compte : tu les retrouves sur tous tes appareils." : "Ta progression est enregistrée dans ce navigateur.";
}
async function connectStore() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc(`data/users/${uid}/progress`);
    const codeRef = db.doc(`data/users/${uid}/code`);
    const res = await Promise.race([Promise.all([ref.get(), codeRef.get()]), sleep(10000).then(() => "timeout")]);
    if (res === "timeout") return;
    const [snap, csnap] = res;
    store.ref = ref; store.codeRef = codeRef;
    if (snap.exists) S = merge(S, snap.data() || {});
    if (csnap.exists) CODE = Object.assign({}, CODE, (csnap.data() || {}).code || {});
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); localStorage.setItem(LS_CODE, JSON.stringify(CODE)); } catch (e) {}
    setSync("compte");
    if (!snap.exists && (Object.keys(S.done).length || Object.keys(S.ex).length)) pushRemote();
    if (!csnap.exists && Object.keys(CODE).length) pushCode();
    const a = document.activeElement;
    if (!(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"))) render(); else updateGlobal();
  } catch (e) { /* on reste en local */ }
}

/* ================================================================ calculs */
const passMark = q => Math.ceil(0.75 * q.questions.length);
function quizPassed(id) { const q = C.quizzes[id]; return q && (S.quiz[id] ?? 0) >= passMark(q); }
function unitsOf(id) {
  const it = ITEM(id); if (!it) return [0, 0];
  if (it.kind === "quiz") return [2, quizPassed(id) ? 2 : 0];
  const ex = it.exercises || [];
  return [1 + ex.length, (S.done[id] ? 1 : 0) + ex.filter(e => S.ex[e.id]).length];
}
function statsOf(ids) { let t = 0, d = 0; for (const id of ids) { const [a, b] = unitsOf(id); t += a; d += b; } return { total: t, done: d, p: pct(d, t) }; }
function moduleStats(M) { return statsOf(moduleItems(M)); }
function coverage(M) { const n = M.sections.length; const c = M.sections.filter(s => s.lecons.length).length; return { n, c, p: pct(c, n) }; }
function trackStats(T) { const ids = new Set(); for (const M of T.modules) for (const id of moduleItems(M)) ids.add(id); return statsOf([...ids]); }
function globalStats() { return statsOf(ORDER).p; }
function itemState(id) {
  const it = ITEM(id); if (!it) return "";
  if (it.kind === "quiz") { const s = S.quiz[id]; return quizPassed(id) ? "done" : s ? "half" : ""; }
  if (S.done[id]) return "done";
  return (it.exercises || []).some(e => S.ex[e.id]) ? "half" : "";
}
function nextItem() { return ORDER.find(id => itemState(id) !== "done") || null; }
function streak() {
  const set = new Set(S.days); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  for (;;) { const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; if (!set.has(k)) break; n++; d.setDate(d.getDate() - 1); }
  return n;
}
function weekIds(w) { const ids = []; for (const mid of w.modules) for (const id of moduleItems(MOD[mid].M)) if (!ids.includes(id)) ids.push(id); return ids; }
function currentWeek() {
  if (S.week) return S.week;
  for (const w of C.plan) { const s = statsOf(weekIds(w)); if (s.total && s.p < 100) return w.semaine; }
  return C.plan[C.plan.length - 1].semaine;
}
function updateGlobal() {
  if (!C) return;
  const g = globalStats();
  $("#gmeter").style.width = g + "%";
  $("#gpct").textContent = g + " %";
}
function maybeAutoDone(it) {
  if (!it.exercises || !it.exercises.length) return;
  if (it.exercises.every(e => S.ex[e.id]) && !S.done[it.id]) { S.done[it.id] = true; save(); const b = $(".done-btn"); if (b) setDoneBtn(b, it); }
}

/* ================================================================ Python (Pyodide) */
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/";
let pyReady = null, py = null, pyRun = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Impossible de charger " + src)); document.head.appendChild(s); });
}
function ensurePython(onStatus) {
  if (pyReady) return pyReady;
  pyReady = (async () => {
    onStatus && onStatus("Chargement de Python dans ton navigateur (une seule fois, environ 10 Mo)…");
    await loadScript(PYODIDE_URL + "pyodide.js");
    py = await loadPyodide({ indexURL: PYODIDE_URL });
    for (const [name, src] of Object.entries(C.labs)) py.FS.writeFile(name, src);
    py.FS.writeFile("runner.py", C.runner);
    py.runPython("import sys\nsys.path.insert(0, '.')\nimport pxshim, runner\nasync def _run(code, key, check, fresh):\n    return await runner.run_async(code, key, check if check else None, bool(fresh))");
    pyRun = py.globals.get("_run");
    onStatus && onStatus("Chargement des jeux de données…");
    for (const f of ["penguins.csv", "titanic.csv", "tips.csv"]) py.FS.writeFile(f, await (await fetch("data/" + f)).text());
    return py;
  })();
  pyReady.catch(() => { pyReady = null; });
  return pyReady;
}
async function runPython(code, key, check, fresh, onStatus) {
  await ensurePython(onStatus);
  const all = code + "\n" + (check || "");
  const LOCAL = /^\s*(?:import|from)\s+(plotly|fakeapi|brewly|llm|cloudsync|immo|paiements|minifast|pxshim)\b.*$/gm;
  const scan = all.replace(LOCAL, "");
  let needs = "";
  if (/\bbrewly\b/.test(all)) needs += "import sqlite3\n";
  if (/\b(immo|paiements)\b/.test(all)) needs += "import numpy\nimport pandas\n";
  try { onStatus && onStatus("Chargement des bibliothèques nécessaires…"); await py.loadPackagesFromImports(needs + scan); } catch (e) {}
  if (needs) { try { await py.loadPackage("sqlite3"); } catch (e) {} }
  onStatus && onStatus("Exécution…");
  await sleep(30);
  return JSON.parse(await pyRun(code, key, check || "", !!fresh));
}

/* ================================================================ éditeur */
function highlight(code, lang = "python") {
  if (window.hljs && hljs.getLanguage(lang)) { try { return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value; } catch (e) {} }

}
function makeEditor(code, onChange, onRun) {
  const wrap = h(`<div class="ed"><pre aria-hidden="true"><code></code></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Éditeur de code Python"></textarea></div>`);
  const ta = $("textarea", wrap), pre = $("pre", wrap), co = $("code", wrap);
  let escaped = false;
  const sync = () => { co.innerHTML = highlight(ta.value) + "\n"; pre.scrollLeft = ta.scrollLeft; };
  ta.value = code; sync();
  ta.addEventListener("input", () => { sync(); onChange && onChange(ta.value); });
  ta.addEventListener("scroll", () => { pre.scrollLeft = ta.scrollLeft; });
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); onRun && onRun(); return; }
    if (e.key === "Escape") { escaped = true; return; }
    if (e.key === "Tab" && !escaped && !e.shiftKey) { e.preventDefault(); insert("    "); return; }
    if (e.key === "Tab") { escaped = false; return; }
    if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
      const s = ta.selectionStart, before = ta.value.slice(0, s);
      const cur = before.slice(before.lastIndexOf("\n") + 1);

      e.preventDefault(); insert("\n" + ind);
    }

  return { el: wrap, get: () => ta.value, set: v => { ta.value = v; sync(); onChange && onChange(v); } };
}

const ERR_FR = { NameError: "Nom inconnu", SyntaxError: "Erreur de syntaxe", IndentationError: "Erreur d'indentation", TypeError: "Erreur de type", KeyError: "Clé introuvable", IndexError: "Indice hors limites", ZeroDivisionError: "Division par zéro", AttributeError: "Attribut inconnu", ValueError: "Valeur invalide", ModuleNotFoundError: "Module introuvable", ImportError: "Import impossible", OperationalError: "Erreur SQL", DatabaseError: "Erreur SQL" };

  if (r.stderr && !r.error) box.appendChild(h(`<div class="out"><pre class="muted">${esc(r.stderr)}</pre></div>`));

const caps = { sample: null, tts: null };
function mdLite(s) {
  const parts = String(s).split(/```(?:\w+)?\n?([\s\S]*?)```/g);
  let html = "";
  parts.forEach((p, i) => {
    if (i % 2 === 1) { html += `<pre><code>${esc(p.replace(/\n$/, ""))}</code></pre>`; return; }
    for (const b of p.split(/\n{2,}/).map(b => b.trim()).filter(Boolean)) {
      const t = esc(b).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
      if (/^(- |\* |\d+\. )/m.test(b)) {
        const items = t.split(/\n/).map(l => `<li>${l.replace(/^(- |\* |\d+\. )/, "")}</li>`).join("");
        html += /^\d+\. /.test(b) ? `<ol>${items}</ol>` : `<ul>${items}</ul>`;
      } else html += `<p>${t.replace(/\n/g, "<br>")}</p>`;
    }
  });
  return html;
}
const TUTOR_ROLE = "Tu es le tuteur d'une plateforme de préparation pour un adulte francophone en reconversion, inscrit aux formations FullStack AI puis Lead AI de Jedha. Il vise un très haut niveau. Tu le tutoies, tu es chaleureux, exigeant, précis et bref. Tu réponds en français.";

}

/* ================================================================ lecture audio
   Lit la leçon paragraphe par paragraphe, avec un bouton ▶ sur chaque bloc et une barre de lecture.
   Moteur : la voix de Claude (capacité tts) quand elle est offerte, sinon la synthèse vocale du navigateur. */
const RATES = [0.8, 1, 1.25, 1.5];
const Reader = { segs: [], i: -1, state: "idle", tok: 0, bar: null, refused: false, follow: true,
  rate: (() => { try { return +localStorage.getItem("prepa-ai:rate") || 1; } catch (e) { return 1; } })() };
const canSpeak = () => !Reader.refused && (!!caps.tts || "speechSynthesis" in window);

function sayText(el) {
  let t = (el.innerText || el.textContent || "").replace(/^▶\s*/, "");
  t = t.replace(/→/g, ", ").replace(/≈/g, " environ ").replace(/×/g, " fois ").replace(/≤/g, " inférieur ou égal à ").replace(/≥/g, " supérieur ou égal à ")
       .replace(/[•·]/g, ", ").replace(/\s*\n+\s*/g, ". ").replace(/\s{2,}/g, " ").replace(/\.\s*\./g, ".").trim();
  return t.length > 1900 ? t.slice(0, t.lastIndexOf(" ", 1900)) + "…" : t;
}
function collectSegments(root) {
  const segs = [];
  const add = el => { if (sayText(el).length > 1) segs.push(el); };
  for (const el of $(".prose", root).children) {
    if (/^(P|H2|H3|H4)$/.test(el.tagName)) add(el);
    else if (el.tagName === "UL" || el.tagName === "OL") [...el.children].forEach(add);
    else if (el.tagName === "BLOCKQUOTE" || el.classList.contains("callout")) add(el);
    else if (el.classList.contains("table-wrap")) $$("tr", el).forEach(add);
  }
  for (const el of $$(".tasks-zone .section-t, .tasks-zone li, .ex-zone .exo", root)) {
    if (el.classList.contains("exo")) { const p = $(".prompt", el); if (p) { p.dataset.say = `${$(".num", el).textContent}. ${$("h3", el).textContent}. `; segs.push(p); } }
    else add(el);
  }
  return segs;
}
function segText(el) { return (el.dataset.say || "") + sayText(el); }

function markSegment(i) {
  $$(".reading").forEach(e => e.classList.remove("reading"));
  const el = Reader.segs[i]; if (!el) return;
  el.classList.add("reading");
  if (Reader.follow) el.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "center" });
  updateBar();
}
function updateBar() {
  const b = Reader.bar; if (!b) return;
  const n = Reader.segs.length, i = Math.max(0, Reader.i);
  $(".rd-play", b).innerHTML = Reader.state === "playing" ? "❚❚" : "▶";
  $(".rd-play", b).setAttribute("aria-label", Reader.state === "playing" ? "Pause" : "Lecture");
  $(".rd-pos", b).textContent = Reader.state === "done" ? "Fin de la leçon" : `Paragraphe ${i + 1} / ${n}`;
  $(".rd-rate", b).textContent = String(Reader.rate).replace(".", ",") + "×";
  $(".rd-fill", b).style.width = `${n ? ((Reader.state === "done" ? n : i) / n) * 100 : 0}%`;
}
function showBar() {
  if (Reader.bar) return;
  const b = h(`<div class="reader" role="region" aria-label="Lecture audio">
    <div class="rd-track"><i class="rd-fill"></i></div>
    <div class="rd-in">
      <button type="button" class="rd-btn rd-prev" aria-label="Paragraphe précédent">⏮</button>
      <button type="button" class="rd-btn rd-play big" aria-label="Pause">❚❚</button>
      <button type="button" class="rd-btn rd-next" aria-label="Paragraphe suivant">⏭</button>
      <span class="rd-pos tab"></span>
      <button type="button" class="rd-btn rd-rate" aria-label="Vitesse de lecture"></button>
      <button type="button" class="rd-btn rd-close" aria-label="Arrêter la lecture">✕</button>
    </div></div>`);
  $(".rd-prev", b).addEventListener("click", () => readFrom(Math.max(0, Reader.i - 1)));
  $(".rd-next", b).addEventListener("click", () => { if (Reader.i < Reader.segs.length - 1) readFrom(Reader.i + 1); });
  $(".rd-play", b).addEventListener("click", togglePause);
  $(".rd-rate", b).addEventListener("click", () => {
    Reader.rate = RATES[(RATES.indexOf(Reader.rate) + 1) % RATES.length] || 1;
    try { localStorage.setItem("prepa-ai:rate", Reader.rate); } catch (e) {}
    if (caps.tts && Reader.engine === "claude") { try { caps.tts.setRate?.(Reader.rate); } catch (e) {} }
    else if (Reader.state === "playing") readFrom(Reader.i);
    updateBar();
  });

  document.body.appendChild(b); document.body.classList.add("reading-on");
  Reader.bar = b;
}
function stopReading() {
  Reader.tok++;
  if (Reader.engine === "claude" && caps.tts) caps.tts.stop().catch(() => {});
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  Reader.state = "idle"; Reader.i = -1;
  $$(".reading").forEach(e => e.classList.remove("reading"));
  if (Reader.bar) { Reader.bar.remove(); Reader.bar = null; }
  document.body.classList.remove("reading-on");
  $$(".listen-btn").forEach(b => b.textContent = "🎧 Écouter la leçon");
}
function togglePause() {
  if (Reader.state === "playing") {
    Reader.state = "paused";
    if (Reader.engine === "claude") caps.tts.pause().catch(() => {});
    else { Reader.tok++; speechSynthesis.cancel(); }
  } else if (Reader.state === "paused") {
    if (Reader.engine === "claude") { Reader.state = "playing"; caps.tts.resume().catch(() => {}); }

}
function finishReading() { Reader.state = "done"; $$(".reading").forEach(e => e.classList.remove("reading")); updateBar(); }

/* --- moteur 1 : la voix de Claude, toute la suite de la leçon en une lecture --- */
function readWithClaude(i, tok) {
  Reader.engine = "claude";
  const lines = Reader.segs.slice(i, i + 100).map((el, k) => ({ text: segText(el), id: "s" + (i + k), language: "fr" }));
  caps.tts.speak(lines, { rate: Reader.rate, language: "fr" }).then(() => {
    if (tok !== Reader.tok) return;
    if (i + 100 < Reader.segs.length) readFrom(i + 100); else finishReading();
  }).catch(e => {
    if (tok !== Reader.tok) return;
    if (e && (e.code === "not_granted" || e.code === "unavailable")) { Reader.refused = true; document.body.classList.remove("can-listen"); stopReading(); return; }
    if (e && e.code === "stopped" && e.reason === "viewer_stopped") { stopReading(); return; }

/* --- moteur 2 : la synthèse vocale du navigateur, phrase par phrase --- */
let frVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const v = speechSynthesis.getVoices().filter(v => /^fr(-|_|$)/i.test(v.lang));
  const score = x => (/fr[-_]FR/i.test(x.lang) ? 4 : 0) + (/premium|enhanced|natural|neural|google|amélie|amelie|thomas|audrey|denise|henri|marie/i.test(x.name) ? 3 : 0) + (x.localService ? 1 : 0);

  return frVoice;
}

function chunks(text) {
  const out = []; let cur = "";

}

  let k = 0;
  const next = () => {
    if (tok !== Reader.tok) return;
    if (k >= parts.length) { if (i + 1 < Reader.segs.length) readFrom(i + 1, true); else finishReading(); return; }
    const u = new SpeechSynthesisUtterance(parts[k++]);
    u.lang = frVoice ? frVoice.lang : "fr-FR"; if (frVoice) u.voice = frVoice;

/* Ajoute les boutons ▶ à chaque bloc lisible, et renvoie le bouton « Écouter la leçon ». */
function setupReader(root) {
  Reader.segs = collectSegments(root);
  (Reader.unsub || []).forEach(f => { try { f(); } catch (e) {} });
  Reader.unsub = [];
  if (caps.tts) {
    Reader.unsub.push(caps.tts.onLine?.(({ id }) => { if (id && Reader.engine === "claude") { const n = +id.slice(1); if (Reader.segs[n]) { Reader.i = n; markSegment(n); } } }));

      if (Reader.engine !== "claude") return;
      if (state === "paused") { Reader.state = "paused"; updateBar(); }
      else if (state === "speaking" && Reader.state === "paused") { Reader.state = "playing"; updateBar(); }
      else if (state === "idle" && (reason === "viewer_stopped" || reason === "hidden" || reason === "time_limit")) stopReading();
    }));

  }
  Reader.segs.forEach((el, i) => {
    const b = h(`<button type="button" class="say" aria-label="Écouter à partir d'ici" title="Écouter à partir d'ici">▶</button>`);

        ${nx ? `<a class="continue" href="#${nx}"><span class="eyebrow">${g === 0 ? "Commencer" : "Reprendre"} · ${esc(MOD[HOME[nx]].M.titre)}</span><b>${esc(label(nx))}</b><span class="muted" style="font-size:13px">${esc(kindLabel(nx))} · ${esc(meta(nx))} →</span></a>`
              : `<div class="continue"><b>Tu as tout terminé. Bravo !</b><span class="muted">Refais les quiz, peaufine tes projets, et prépare ton Demo Day.</span></div>`}
      </div>
    </section>
    <section class="stats">
      <div class="card stat"><b class="tab">${nLessons}/${allLessons.length}</b><span>leçons et projets terminés</span></div>
      <div class="card stat"><b class="tab">${nEx}/${totEx}</b><span>exercices réussis</span></div>
      <div class="card stat"><b class="tab">${nQuiz}/${qs.length}</b><span>quiz réussis (75 % ou plus)</span></div>
      <div class="card stat"><b class="tab">${S.days.length}</b><span>jours de pratique · série de ${streak()}</span></div>
    </section>
    <div class="section-h"><h2>Ton plan de ${C.plan.length} semaines</h2><p>20 h et plus par semaine : Essentials d'abord, puis le FullStack</p></div>
    <div class="plan" role="list" style="--n:${C.plan.length}">${C.plan.map(w => { const s = statsOf(weekIds(w)); return `<button class="wk ${w.semaine === cw ? "cur" : ""}" type="button" data-w="${w.semaine}" role="listitem"><span class="n">S${w.semaine}</span><span class="t">${esc(w.titre)}</span><div class="bar"><i style="width:${s.p}%"></i></div></button>`; }).join("")}</div>
    <div class="card wkdetail"></div>
    <div class="section-h"><h2>Les programmes</h2><p>Les modules officiels, et ce que la plateforme couvre déjà</p></div>
    <div class="tabs" role="tablist">${C.tracks.map(t => `<button role="tab" type="button" data-t="${t.id}" aria-selected="${t.id === T.id}">${esc(t.nom)}</button>`).join("")}</div>
    <p class="muted" style="margin:0 0 12px">${esc(T.intro)}</p>
    <section class="modules">${T.modules.map(moduleCard).join("")}</section>
    <section class="extras">
      <a class="card" href="#jour-j"><span class="eyebrow">Checklist</span><b>Prêt pour le jour J ?</b><span class="muted" style="font-size:14px">${C.jourj.filter((_, i) => S.tasks["jj-" + i]).length}/${C.jourj.length} points validés</span></a>
      <a class="card" href="#ressources"><span class="eyebrow">Pour aller plus loin</span><b>Ressources gratuites</b><span class="muted" style="font-size:14px">Cours, vidéos et documentations, module par module</span></a>
    </section>
    <p class="sync" id="sync"></p>
  </div>`);
  app().replaceChildren(el);
  setSync(store.mode);
  const showWeek = n => {
    const w = C.plan.find(x => x.semaine === n);
    const ids = weekIds(w);
    const s = statsOf(ids);
    $(".wkdetail", el).innerHTML = `<div class="eyebrow">Semaine ${w.semaine} · ${esc(w.heures)} · ${s.p} % fait</div><h3>${esc(w.titre)}</h3>
      <ul>${w.modules.map(mid => { const { M, T } = MOD[mid]; const cv = coverage(M); return `<li><a href="#m-${mid}">${esc(M.titre)}</a> <span class="muted" style="font-size:13px">· ${esc(T.nom)} · ${cv.p} % du module préparé ici</span></li>`; }).join("")}</ul>
      <div class="lesson-tools"><button class="btn small" type="button" data-cur="${n}">${S.week === n ? "✓ Ma semaine en cours" : "Définir comme ma semaine en cours"}</button></div>`;
    $$(".wk", el).forEach(b => b.classList.toggle("cur", +b.dataset.w === n));
    $("[data-cur]", el).addEventListener("click", () => { S.week = S.week === n ? null : n; save(); showWeek(n); });
  };
  showWeek(cw);
  $$(".wk", el).forEach(b => b.addEventListener("click", () => showWeek(+b.dataset.w)));
  $$(".tabs button", el).forEach(b => b.addEventListener("click", () => { S.track = b.dataset.t; save(); render(); }));
  $("#start", el).addEventListener("change", e => { S.start = e.target.value || null; save(); render(); });
}
function moduleCard(M, i) {
  const s = moduleStats(M), cv = coverage(M);
  return `<a class="card mod" href="#m-${M.id}">
    <span class="num"><span>${M.jours ? `${M.jours} jour${M.jours > 1 ? "s" : ""} chez Jedha` : "Avant la formation"}</span><span>S${M.semaine}</span></span>
    <b>${esc(M.titre)}</b><span class="obj">${esc(M.objectif)}</span>
    <div class="meters">
      <div class="row"><span>Préparé ici</span><span>${cv.c}/${cv.n} sections</span></div>
      <div class="bar cov"><i style="width:${cv.p}%"></i></div>
      <div class="row"><span>Ta progression</span><span>${s.total ? s.p + " %" : "—"}</span></div>
      <div class="bar"><i style="width:${s.p}%"></i></div>
    </div></a>`;
}
function viewModule(mid) {
  const { M, T } = MOD[mid];
  setTop({ href: "#accueil", label: "Accueil" });
  const s = moduleStats(M), cv = coverage(M);
  const el = h(`<div class="read">
    <div class="pagehead"><div class="crumbs"><a href="#accueil">Accueil</a><span>/</span><span>${esc(T.nom)}</span></div>
      <h1>${esc(M.titre)}</h1><p>${esc(M.objectif)}</p>
      <div class="lesson-tools"><span class="badge jedha">${M.jours ? `${M.jours} jour${M.jours > 1 ? "s" : ""} chez Jedha` : "Avant la formation"}</span><span class="badge">Semaine ${M.semaine} du plan</span><span class="badge ok">${cv.c}/${cv.n} sections préparées ici</span>${s.total ? `<span class="badge">${s.p} % fait</span>` : ""}</div>
    </div>
    <h2 class="section-t" style="margin-top:8px">Le programme, section par section</h2>
    <p class="muted" style="margin:0 0 6px">Chaque bloc correspond à une section du programme Jedha. En dessous, les leçons qui t'y préparent.</p>
    ${M.sections.map(sec => `<div class="card sec"><div class="sec-h"><b>${esc(sec.titre)}</b>${sec.lecons.length ? `<span class="badge ok">Préparé</span>` : `<span class="badge soon">Prochaine vague</span>`}${sec.local ? `<span class="badge local">Sur ton ordinateur</span>` : ""}</div>
      ${sec.lecons.length ? `<ul class="items">${sec.lecons.map(itemRow).join("")}</ul>` : `<p class="soon-txt">Cette section sera ajoutée dans une prochaine vague de contenu.${sec.local ? " Elle se pratiquera surtout sur ton ordinateur, avec des guides pas à pas." : ""}</p>`}</div>`).join("")}
    ${M.projets.length || M.quiz.length ? `<h2 class="section-t">Projets et quiz</h2><nav class="card list" style="padding:6px">${[...M.projets, ...M.quiz].map(id => `<a href="#${id}">${dot(itemState(id))}<span><span class="k">${kindLabel(id)}</span><br><b>${esc(label(id))}</b></span><span class="meta muted tab" style="font-size:13px">${esc(meta(id))}</span></a>`).join("")}</nav>` : ""}
  </div>`);
  app().replaceChildren(el);
}
function setDoneBtn(b, it) { const on = !!S.done[it.id]; b.classList.toggle("on", on); b.textContent = on ? "✓ Terminé" : "Marquer comme terminé"; }
function navLinks(id) {
  const pos = ORDER.indexOf(id), prev = ORDER[pos - 1], next = ORDER[pos + 1];
  return { prev, next };
}
function viewLesson(it) {
  const { M, T } = MOD[HOME[it.id]];
  setTop({ href: "#m-" + M.id, label: M.titre.length > 26 ? M.titre.slice(0, 24) + "…" : M.titre });
  const { prev, next } = navLinks(it.id);
  const el = h(`<article class="read">
    <div class="pagehead">
      <div class="crumbs"><a href="#accueil">Accueil</a><span>/</span><a href="#m-${M.id}">${esc(M.titre)}</a><span>/</span><span>${it.kind === "project" ? "Projet" : "Leçon"}</span></div>
      <h1>${esc(it.title)}</h1>
      <p class="tab">${it.minutes ? `${it.minutes} min` : ""}${it.exercises.length ? ` · ${it.exercises.length} exercice${it.exercises.length > 1 ? "s" : ""}` : ""}${it.tasks.length ? ` · ${it.tasks.length} action${it.tasks.length > 1 ? "s" : ""} sur ton ordinateur` : ""}</p>
      <div class="lesson-tools"></div>
    </div>
    <div class="prose">${it.body}</div>
    <div class="tasks-zone"></div><div class="ex-zone"></div><div class="tutor-zone"></div>
    <div class="foot">
      ${prev ? `<a class="btn ghost" href="#${prev}">← ${esc(shortLabel(prev))}</a>` : "<span></span>"}
      <button class="btn done-btn" type="button"></button>
      ${next ? `<a class="btn primary" href="#${next}">${esc(shortLabel(next))} →</a>` : "<span></span>"}
    </div></article>`);
  enhanceProse($(".prose", el), it.id);
  if (it.tasks.length) {
    const z = $(".tasks-zone", el);
    z.appendChild(h(`<h2 class="section-t">À faire sur ton ordinateur</h2>`));
    const ul = h(`<ul class="card tasks"></ul>`);
    it.tasks.forEach((t, i) => {
      const key = `${it.id}-t${i}`;
      const li = h(`<li><label><input type="checkbox" id="${key}" ${S.tasks[key] ? "checked" : ""}><span>${esc(t)}</span></label></li>`);
      $("input", li).addEventListener("change", e => { if (e.target.checked) S.tasks[key] = true; else delete S.tasks[key]; save(); });
      ul.appendChild(li);
    });
    z.appendChild(ul);
  }
  if (it.exercises.length) {
    const z = $(".ex-zone", el);
    z.appendChild(h(`<h2 class="section-t">Exercices</h2>`));
    z.appendChild(h(`<p class="muted" style="margin:0 0 6px">Écris ton code, puis clique sur Vérifier (ou Ctrl + Entrée). Ton code est sauvegardé automatiquement.</p>`));
    it.exercises.forEach((ex, i) => z.appendChild(makeExercise(ex, i + 1, it)));
  }
  $(".tutor-zone", el).appendChild(lessonTutor(it));
  $(".lesson-tools", el).appendChild(setupReader(el));
  const db = $(".done-btn", el);
  setDoneBtn(db, it);
  db.addEventListener("click", () => { if (S.done[it.id]) delete S.done[it.id]; else S.done[it.id] = true; save(); setDoneBtn(db, it); });
  app().replaceChildren(el);
  if (it.body.includes("language-python") || it.exercises.length) setTimeout(() => ensurePython().catch(() => {}), 600);
}
function viewQuiz(q) {
  const { M } = MOD[HOME[q.id]];
  setTop({ href: "#m-" + M.id, label: M.titre.length > 26 ? M.titre.slice(0, 24) + "…" : M.titre });
  const { next } = navLinks(q.id);
  const n = q.questions.length, need = passMark(q), best = S.quiz[q.id];
  const el = h(`<div class="read">
    <div class="pagehead"><div class="crumbs"><a href="#accueil">Accueil</a><span>/</span><a href="#m-${M.id}">${esc(M.titre)}</a><span>/</span><span>Quiz</span></div>
    <h1>${esc(q.title)}</h1><p>${n} questions. Il faut ${need} bonnes réponses pour le valider.${best != null ? ` Meilleur score : <b class="tab">${best}/${n}</b>.` : ""}</p></div>
    <form class="quiz">${q.questions.map((x, i) => `<fieldset class="card q" style="border:1px solid var(--line)"><legend class="sr">Question ${i + 1}</legend><h3>${i + 1}. ${esc(x.q)}</h3>${x.options.map((o, j) => `<label><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join("")}<div class="exp" hidden></div></fieldset>`).join("")}
    <div class="score-zone"></div>
    <div class="foot"><button class="btn primary" type="submit">Valider mes réponses</button><button class="btn ghost" type="button" data-a="again" hidden>Recommencer</button>${next ? `<a class="btn" href="#${next}">${esc(shortLabel(next))} →</a>` : `<a class="btn" href="#jour-j">Checklist du jour J →</a>`}</div>
    </form></div>`);
  const form = $("form", el);
  form.addEventListener("submit", e => {
    e.preventDefault();
    let score = 0;
    q.questions.forEach((x, i) => {
      const fs = $$("fieldset", form)[i];
      const v = $(`input[name="q${i}"]:checked`, fs);
      const ans = v ? +v.value : -1;
      if (ans === x.answer) score++;
      $$("label", fs).forEach((lb, j) => { lb.classList.toggle("right", j === x.answer); lb.classList.toggle("wrong", j === ans && ans !== x.answer); });
      $$("input", fs).forEach(z => z.disabled = true);
      const exp = $(".exp", fs); exp.hidden = false; exp.textContent = (ans === x.answer ? "Bonne réponse. " : ans < 0 ? "Pas de réponse. " : "Raté. ") + x.explain;
    });
    S.quiz[q.id] = Math.max(S.quiz[q.id] ?? 0, score); save();
    $(".score-zone", form).replaceChildren(h(`<div class="card score"><b class="tab">${score}/${n}</b><span>${score >= need ? "Quiz validé. Bravo !" : `Relis les explications, puis retente ta chance : il faut ${need}/${n}.`}</span></div>`));
    $('[type="submit"]', form).hidden = true; $('[data-a="again"]', form).hidden = false;
    $(".score-zone", form).scrollIntoView({ behavior: "smooth", block: "center" });
  });
  $('[data-a="again"]', form).addEventListener("click", () => viewQuiz(q));
  app().replaceChildren(el);
}
function viewJourJ() {
  setTop({ href: "#accueil", label: "Accueil" });
  const el = h(`<div class="read"><div class="pagehead"><div class="eyebrow">Checklist</div><h1>Prêt pour le jour J ?</h1><p>Coche chaque point quand il est vrai. Objectif : tout cocher avant ton premier jour chez Jedha.</p></div><ul class="card tasks"></ul></div>`);
  const ul = $("ul", el);
  C.jourj.forEach((t, i) => {
    const key = "jj-" + i;
    const li = h(`<li><label><input type="checkbox" id="${key}" ${S.tasks[key] ? "checked" : ""}><span>${esc(t)}</span></label></li>`);
    $("input", li).addEventListener("change", e => { if (e.target.checked) S.tasks[key] = true; else delete S.tasks[key]; save(); });
    ul.appendChild(li);
  });
  app().replaceChildren(el);
}
function viewResources() {
  setTop({ href: "#accueil", label: "Accueil" });
  const el = h(`<div class="read"><div class="pagehead"><div class="eyebrow">Pour aller plus loin</div><h1>Ressources gratuites</h1><p>Pour approfondir une notion, ou la voir expliquée autrement.</p></div>
    <div class="table-wrap"><table><thead><tr><th>Ressource</th><th>Module</th><th>Langue</th><th>Pour quoi faire</th></tr></thead><tbody>
    ${C.resources.map(r => `<tr><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></td><td>${esc(r.module)}</td><td>${esc(r.lang)}</td><td>${esc(r.why)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted" style="font-size:14px">Le glossaire anglais-français se trouve dans la leçon <a href="#l-4-6">L'anglais technique</a>.</p></div>`);
  app().replaceChildren(el);
}

/* ================================================================ routeur */
const route = () => (location.hash || "#accueil").slice(1) || "accueil";
function render() {
  if (!C) return;
  const id = route();
  updateGlobal();
  if (id.startsWith("m-") && MOD[id.slice(2)]) return viewModule(id.slice(2));
  if (C.quizzes[id] && HOME[id]) return viewQuiz(C.quizzes[id]);
  if (C.items[id] && HOME[id]) return viewLesson(C.items[id]);
  if (id === "jour-j") return viewJourJ();
  if (id === "ressources") return viewResources();
  return viewHome();
}
let lastRoute = null;
window.addEventListener("hashchange", () => { const r = route(); if (r !== lastRoute) { lastRoute = r; render(); window.scrollTo(0, 0); } });

/* ================================================================ démarrage */
(async function boot() {
  loadLocal();
  try { C = await (await fetch("content.json")).json(); }
  catch (e) { app().innerHTML = `<div class="boot">Le contenu n'a pas pu se charger. Recharge la page.</div>`; return; }
  indexContent();
  if ("speechSynthesis" in window) document.body.classList.add("can-listen");
  lastRoute = route();
  render();
  connectStore();
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then(s => { if (s) { caps.sample = s; document.body.classList.add("has-sample"); } }).catch(() => {});
    window.plateformeLLMDispo = () => !!caps.sample;
    window.plateformeLLM = async msgs => {
      if (!caps.sample) throw new Error("Aucun LLM disponible sur cet appareil.");
      const arr = Array.from(msgs).map(m => ({ role: m.role, content: String(m.content) }));
      const r = await caps.sample(arr, { cache: false });
      return r.text;
    };
    window.claude.use("tts").then(t => { if (t) { caps.tts = t; document.body.classList.add("has-tts"); try { t.setRate?.(Reader.rate); } catch (e) {} if (C && C.items[route()]) render(); } }).catch(() => {});
  }
})();

</script>
