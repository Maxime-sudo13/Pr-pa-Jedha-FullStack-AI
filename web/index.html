<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03050b">
<meta name="color-scheme" content="dark">
<title>Prépa AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>

/* Mise en page et composants. Les couleurs ci-dessous sont celles d'origine (cahier de labo clair) :
   le thème réellement affiché est défini dans cyber.css, chargé après ce fichier. Les blocs de code reprennent les cellules
   « In [n] / Out [n] » d'un notebook. Mise en page en colonne de lecture, tableau de bord en grille. */
:root {
  --paper: #eef1f6;
  --surface: #ffffff;
  --ink: #111a2e;
  --muted: #5a6478;
  --line: #d6dce7;
  --accent: #2856c4;
  --mark: #ffd43b;
  --ok: #17845a;
  --err: #c2410c;
  --code-bg: #f6f8fb;
  --grid: rgba(40, 86, 196, 0.06);
  --shadow: 0 1px 2px rgba(17, 26, 46, .06), 0 4px 16px rgba(17, 26, 46, .05);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --k-kw: #7c3aed; --k-str: #0f7a4f; --k-num: #b45309; --k-com: #7a8396; --k-fn: #2856c4; --k-bi: #0e7490;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1220; --surface: #141b2d; --ink: #e7ebf3; --muted: #9aa4b8; --line: #263049;
    --accent: #86a8ff; --mark: #e9c84a; --ok: #4cc38a; --err: #ff8f62; --code-bg: #0f1526;
    --grid: rgba(134, 168, 255, 0.05); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.25);
    --k-kw: #c4a5ff; --k-str: #7fd8a8; --k-num: #ffb86b; --k-com: #7b859b; --k-fn: #86a8ff; --k-bi: #67d3e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1220; --surface: #141b2d; --ink: #e7ebf3; --muted: #9aa4b8; --line: #263049;
  --accent: #86a8ff; --mark: #e9c84a; --ok: #4cc38a; --err: #ff8f62; --code-bg: #0f1526;
  --grid: rgba(134, 168, 255, 0.05); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.25);
  --k-kw: #c4a5ff; --k-str: #7fd8a8; --k-num: #ffb86b; --k-com: #7b859b; --k-fn: #86a8ff; --k-bi: #67d3e6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 400 16px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; letter-spacing: -0.01em; }
.tab { font-variant-numeric: tabular-nums; }
.mark { background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); padding: 0 .08em; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- barre du haut ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 17px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand small { font-family: var(--mono); font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 6px; letter-spacing: .04em; }
.top .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.meter { width: 90px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s ease; }
.back { text-decoration: none; font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }

main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 80px; }
.read { max-width: 760px; margin: 0 auto; }

/* ---------- accueil ---------- */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: stretch; margin-bottom: 28px; }
.hero h1 { font-size: clamp(32px, 5.6vw, 56px); font-weight: 800; margin: 6px 0 12px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 18px; color: var(--muted); max-width: 52ch; margin: 0 0 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.resume { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.resume .big { font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 1; }
.resume .big small { font-size: 22px; color: var(--muted); font-weight: 700; }
.epochs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.epochs div { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.epochs i { display: block; height: 100%; background: var(--accent); }
.epochs-l { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; cursor: pointer;
  text-decoration: none; transition: border-color .15s, background .15s, transform .05s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .55; cursor: progress; }
.continue { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: var(--code-bg); border: 1px dashed var(--line); text-decoration: none; color: var(--ink); }
.continue:hover { border-color: var(--accent); }
.continue b { font-family: var(--display); font-size: 18px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
.stat { padding: 14px 16px; }
.stat b { display: block; font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
.jday { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.jday input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; }
.jday b { font-family: var(--display); font-size: 18px; }

.weeks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.week { padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; }
.week h3 { margin: 0; font-size: 22px; }
.week h3 a { color: var(--ink); text-decoration: none; }
.week h3 a:hover { color: var(--accent); }
.week .goal { margin: 0; font-size: 14px; color: var(--muted); }
.bar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.items { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; }
.items li a { display: flex; gap: 10px; align-items: baseline; padding: 6px 4px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14px; }
.items li a:hover { background: var(--code-bg); }
.items .meta { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; font-family: var(--mono); }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); transform: translateY(1px); }
.dot.half { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.dot.done { border-color: var(--ok); background: var(--ok); }
.extras { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 16px; }
.extras a.card { padding: 16px 18px; text-decoration: none; color: var(--ink); display: block; }
.extras a.card:hover { border-color: var(--accent); }
.extras b { font-family: var(--display); font-size: 18px; display: block; }
.sync { font-size: 12px; color: var(--muted); text-align: center; margin-top: 28px; }

/* ---------- page semaine ---------- */
.pagehead { margin: 8px 0 24px; }
.pagehead h1 { font-size: clamp(30px, 5vw, 44px); margin: 6px 0 10px; }
.pagehead p { margin: 0; color: var(--muted); font-size: 17px; }
.list { padding: 6px; }
.list a { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 10px; text-decoration: none; color: var(--ink); }
.list a:hover { background: var(--code-bg); }
.list .k { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.list b { font-weight: 600; }

/* ---------- leçon ---------- */
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.lesson-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.prose { font-size: 17px; }
.prose h2 { font-size: 26px; margin: 40px 0 12px; }
.prose h3 { font-size: 20px; margin: 28px 0 8px; }
.prose p, .prose li { max-width: 68ch; }
.prose code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.prose pre code { border: 0; padding: 0; background: none; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: 4px 0; }
.callout { margin: 24px 0; padding: 14px 18px; border-left: 4px solid var(--mark); background: color-mix(in srgb, var(--mark) 14%, var(--surface)); border-radius: 0 10px 10px 0; }
.callout p { margin: 0; }
.math { overflow-x: auto; padding: 10px 0; text-align: center; color: var(--ink); }
.math svg { max-width: 100%; height: auto; }
.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: 15px; }
.table-wrap th, .table-wrap td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table-wrap tr:last-child td { border-bottom: 0; }
.table-wrap th { font-weight: 600; background: var(--code-bg); }

/* cellules façon notebook */
.cell { margin: 18px 0; display: grid; grid-template-columns: 54px 1fr; gap: 0 8px; }
.gut { font-family: var(--mono); font-size: 12px; color: var(--accent); text-align: right; padding-top: 11px; white-space: nowrap; }
.gut.out { color: var(--err); }
.cellbox { min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); overflow: hidden; }
.cellbox:focus-within { border-color: var(--accent); }
.ed { position: relative; }
.ed pre, .ed textarea {
  margin: 0; padding: 10px 12px; border: 0; font: 400 14px/1.55 var(--mono); tab-size: 4;
  white-space: pre; overflow-wrap: normal; letter-spacing: 0;
}
.ed pre { pointer-events: none; overflow: hidden; min-height: 100%; padding-bottom: 18px; }
.ed textarea { padding-bottom: 18px; }
.ed textarea {
  position: absolute; inset: 0; width: 100%; height: 100%; resize: none; background: transparent;
  color: transparent; caret-color: var(--ink); overflow-x: auto; overflow-y: hidden; outline: none;
}
.ed textarea::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: transparent; }
.static pre { margin: 0; padding: 10px 12px; font: 400 14px/1.55 var(--mono); overflow-x: auto; }
.cellbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px 8px; border-top: 1px solid var(--line); background: var(--surface); }
.cellbar .grow { flex: 1; }
.cellbar .lang { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 0 4px; }
.run { color: var(--accent); }
.output { grid-column: 2; min-width: 0; }
.output:empty { display: none; }
.out { margin-top: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.out pre { margin: 0; padding: 10px 12px; font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow: auto; }
.out .res { overflow-x: auto; padding: 4px; }
.out .note { padding: 6px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.out img { max-width: 100%; display: block; margin: 8px auto; }
.plot { width: 100%; height: 340px; }
table.df { border-collapse: collapse; font: 12.5px/1.4 var(--mono); }
table.df th, table.df td { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.df thead th { background: var(--code-bg); }
table.df tbody th { color: var(--muted); font-weight: 500; }
.err { border-color: color-mix(in srgb, var(--err) 50%, var(--line)); }
.err .head { padding: 8px 12px; background: color-mix(in srgb, var(--err) 10%, var(--surface)); color: var(--err); font-weight: 600; font-size: 14px; }
.err .src { font: 13px/1.5 var(--mono); padding: 6px 12px; border-top: 1px solid var(--line); background: var(--code-bg); overflow-x: auto; white-space: pre; }
.err .hint { padding: 8px 12px; font-size: 14px; border-top: 1px solid var(--line); }
.loading { font-size: 13px; color: var(--muted); padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }


/* coloration syntaxique */
.hljs-keyword, .hljs-meta .hljs-keyword { color: var(--k-kw); }
.hljs-string, .hljs-meta .hljs-string { color: var(--k-str); }
.hljs-number, .hljs-literal { color: var(--k-num); }
.hljs-comment { color: var(--k-com); font-style: italic; }
.hljs-title.function_, .hljs-title.class_, .hljs-title { color: var(--k-fn); }
.hljs-built_in { color: var(--k-bi); }
.hljs-params { color: inherit; }
.hljs-section, .hljs-bullet { color: var(--k-kw); font-weight: 600; }

/* exercices */
.section-t { font-family: var(--display); font-size: 26px; margin: 48px 0 6px; }
.exo { margin: 18px 0 26px; padding: 16px 16px 6px; }
.exo-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.exo-h h3 { margin: 0; font-size: 19px; }
.exo-h .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.status { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.status.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.exo .prompt p { margin: 8px 0; }
.exo .cell { grid-template-columns: 1fr; }
.exo .gut { display: none; }
.exo .output { grid-column: 1; }
.verdict { margin-top: 6px; padding: 10px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; }
.verdict.ok { background: color-mix(in srgb, var(--ok) 12%, var(--surface)); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); }
.verdict.no { background: color-mix(in srgb, var(--err) 9%, var(--surface)); color: var(--err); border: 1px solid color-mix(in srgb, var(--err) 35%, var(--line)); }
.reveal { margin: 8px 0; padding: 10px 12px; border-radius: 10px; background: var(--code-bg); border: 1px dashed var(--line); font-size: 14px; }
.reveal pre { margin: 6px 0 0; font: 13px/1.5 var(--mono); overflow-x: auto; }

/* tâches */
.tasks { list-style: none; padding: 6px 4px; margin: 10px 0; }
.tasks li label { display: flex; gap: 12px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.tasks li label:hover { background: var(--code-bg); }
.tasks input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--ok); flex: none; }
.tasks input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }

/* tuteur */
.tutor { margin-top: 40px; padding: 16px; display: none; }
.has-sample .tutor { display: block; }
.needs-sample { display: none !important; }
.has-sample .needs-sample { display: inline-flex !important; }
.needs-tts { display: none !important; }
.has-tts .needs-tts { display: inline-flex !important; }
.tutor h3 { margin: 0 0 4px; font-size: 19px; }
.thread { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.msg { padding: 10px 12px; border-radius: 10px; font-size: 15px; }
.msg.me { align-self: flex-end; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); max-width: 85%; }
.msg.ai { background: var(--code-bg); border: 1px solid var(--line); }
.msg p { margin: 6px 0; } .msg p:first-child { margin-top: 0; } .msg p:last-child { margin-bottom: 0; }
.msg pre { font: 13px/1.5 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; }
.msg code { font-family: var(--mono); font-size: .9em; }
.ask { display: flex; gap: 8px; align-items: flex-end; }
.ask textarea { flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); resize: vertical; }
.help { margin-top: 6px; }

/* bas de leçon */
.foot { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); }
.done-btn.on { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* quiz */
.q { padding: 16px 18px; margin: 14px 0; }
.q h3 { font-family: var(--body); font-size: 17px; font-weight: 600; margin: 0 0 10px; line-height: 1.4; }
.q label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
.q label:hover { background: var(--code-bg); }
.q input { margin-top: 5px; accent-color: var(--accent); }
.q label.right { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.q label.wrong { border-color: color-mix(in srgb, var(--err) 45%, var(--line)); background: color-mix(in srgb, var(--err) 8%, var(--surface)); }
.q .exp { margin-top: 8px; font-size: 14px; color: var(--muted); }
.score { padding: 18px; margin: 18px 0; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.score b { font-family: var(--display); font-size: 40px; font-weight: 800; }

.boot { padding: 80px 16px; text-align: center; color: var(--muted); }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .weeks, .extras { grid-template-columns: 1fr; }
  .cell { grid-template-columns: 1fr; }
  .gut { display: none; }
  .output { grid-column: 1; }
  .prose { font-size: 16px; }
  .brand small { display: none; }
  .meter { width: 60px; }
  .ed pre, .ed textarea { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- parcours ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 16px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tabs .tag { font-size: 11px; font-weight: 500; margin-left: 6px; opacity: .8; }
.section-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 36px 0 10px; }
.section-h h2 { margin: 0; font-size: 26px; }
.section-h p { margin: 0; color: var(--muted); font-size: 14px; }
.modules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.mod { padding: 16px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); position: relative; }
.mod:hover { border-color: var(--accent); }
.mod .num { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.mod b { font-family: var(--display); font-size: 18px; line-height: 1.2; }
.mod .obj { font-size: 13px; color: var(--muted); }
.mod .meters { display: grid; gap: 4px; margin-top: auto; }
.mod .row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--mono); }
.bar.cov > i { background: repeating-linear-gradient(45deg, var(--mark), var(--mark) 4px, color-mix(in srgb, var(--mark) 60%, transparent) 4px, color-mix(in srgb, var(--mark) 60%, transparent) 8px); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); white-space: nowrap; }
.badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.badge.soon { color: var(--muted); border-style: dashed; }
.badge.local { color: var(--k-bi); border-color: color-mix(in srgb, var(--k-bi) 40%, var(--line)); }
.badge.jedha { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }

/* plan 10 semaines */
.plan { display: grid; grid-template-columns: repeat(var(--n, 10), 1fr); gap: 6px; }
.wk { padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 6px; min-width: 0; cursor: pointer; text-align: left; }
.wk:hover { border-color: var(--accent); }
.wk.cur { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.wk .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.wk .t { font-size: 12px; font-weight: 600; line-height: 1.25; }
.wk .bar { height: 4px; margin-top: auto; }
.wkdetail { margin-top: 10px; padding: 14px 16px; }
.wkdetail h3 { margin: 0 0 4px; font-size: 20px; }
.wkdetail ul { margin: 8px 0 0; padding-left: 1.1em; }

/* sections d'un module */
.sec { padding: 14px 16px; margin: 10px 0; }
.sec-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sec-h b { font-size: 16px; margin-right: auto; }
.sec .items { margin-top: 6px; }
.sec .soon-txt { font-size: 14px; color: var(--muted); margin: 6px 0 0; }

/* ---------- visualisations interactives ---------- */
.viz { margin: 22px 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.viz-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--code-bg); }
.viz-h b { font-family: var(--display); font-size: 15px; }
.viz-h .eyebrow { margin-left: auto; }
.viz-b { padding: 14px; }
.viz-b svg { display: block; width: 100%; height: auto; overflow: visible; }
.viz-c { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.viz-c label { display: inline-flex; align-items: center; gap: 8px; }
.viz-c input[type=range] { width: 140px; accent-color: var(--accent); }
.viz-c output { font-family: var(--mono); font-size: 13px; min-width: 3.5em; }
.viz-note { font-size: 14px; color: var(--muted); padding: 0 14px 12px; }
.viz-note b { color: var(--ink); }
.vz-ink { fill: var(--ink); } .vz-muted { fill: var(--muted); } .vz-accent { fill: var(--accent); } .vz-mark { fill: var(--mark); }
.vz-ok { fill: var(--ok); } .vz-err { fill: var(--err); } .vz-surface { fill: var(--surface); } .vz-code { fill: var(--code-bg); }
.vz-line { stroke: var(--line); } .vz-sacc { stroke: var(--accent); } .vz-sink { stroke: var(--ink); } .vz-serr { stroke: var(--err); } .vz-sok { stroke: var(--ok); } .vz-smuted { stroke: var(--muted); }
.vz-t { font: 12px var(--body); fill: var(--ink); } .vz-tm { font: 11px var(--mono); fill: var(--muted); } .vz-tc { font: 12px var(--mono); fill: var(--ink); }
.vz-tb { font: 600 13px var(--body); fill: var(--ink); }
.vtab { width: 100%; border-collapse: collapse; font: 13px var(--mono); }
.vtab th, .vtab td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; transition: background .25s, opacity .25s; }
.vtab th { background: var(--code-bg); font-weight: 600; }
.vtab tr.hl td { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.vtab tr.dim td { opacity: .3; }
.vtab td.null { color: var(--muted); font-style: italic; }
.vgrid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; align-items: start; }
.vgrid > div { min-width: 0; overflow-x: auto; }
.vcap { font: 600 12px var(--mono); color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
.gcolor-0 { background: color-mix(in srgb, var(--accent) 16%, var(--surface)) !important; }
.gcolor-1 { background: color-mix(in srgb, var(--mark) 30%, var(--surface)) !important; }
.gcolor-2 { background: color-mix(in srgb, var(--ok) 18%, var(--surface)) !important; }
.objs { display: flex; gap: 10px; flex-wrap: wrap; }
.objcard { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: 12.5px/1.5 var(--mono); background: var(--code-bg); animation: pop .35s ease; }
.objcard b { font-family: var(--body); }
@keyframes pop { from { transform: translateY(-8px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.json { font: 12.5px/1.5 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; margin: 0; min-height: 4em; }
@media (max-width: 900px) { .modules { grid-template-columns: repeat(2, 1fr); } .plan { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 560px) { .modules { grid-template-columns: 1fr; } .vgrid { grid-template-columns: 1fr; } }

.epochs-l span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.badge, .meta, .pill, .stat b, .big { white-space: nowrap; }

/* ================================================================ thème « cyber » : noir profond, bleu électrique, lueurs cyan.
   Toujours sombre, quel que soit le réglage du système. Chargé après base.css et extra.css. */
:root, :root:not([data-theme="light"]), :root[data-theme="dark"], :root[data-theme="light"] {
  --paper: #03050b;
  --surface: #0a1020;
  --ink: #e8f1ff;
  --muted: #8b9ac0;
  --line: #18264a;
  --accent: #3b82ff;
  --accent-2: #00e1ff;
  --mark: #00e1ff;
  --ok: #00f0a0;
  --err: #ff4d6d;
  --code-bg: #050913;
  --grid: rgba(59, 130, 255, 0.06);
  --glow: 0 0 0 1px rgba(59, 130, 255, .35), 0 0 24px rgba(59, 130, 255, .35), 0 0 60px rgba(0, 225, 255, .12);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 40px rgba(0, 0, 0, .55);
  --grad: linear-gradient(100deg, #3b82ff 0%, #00e1ff 100%);
  --display: "Space Grotesk", "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --k-kw: #b48cff; --k-str: #5cf2c0; --k-num: #ffb86b; --k-com: #56658a; --k-fn: #5aa2ff; --k-bi: #00e1ff;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #03050b; --surface: #0a1020; --ink: #e8f1ff; --muted: #8b9ac0; --line: #18264a; --accent: #3b82ff; --mark: #00e1ff; --ok: #00f0a0; --err: #ff4d6d; --code-bg: #050913; }
}

/* ---------- fond : nuit, halos bleus, grille qui s'efface, grain ---------- */
html { background: var(--paper); }
body {
  background-color: var(--paper);
  background-image:
    radial-gradient(1200px 600px at 15% -10%, rgba(59, 130, 255, .22), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(0, 225, 255, .10), transparent 55%),
    radial-gradient(800px 600px at 50% 120%, rgba(59, 130, 255, .10), transparent 60%);
  background-size: auto;
  background-attachment: fixed;
  letter-spacing: .005em;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 85%);
  mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 85%);
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px);
  mix-blend-mode: overlay;
}
main, .top { position: relative; z-index: 1; }
::selection { background: rgba(0, 225, 255, .3); color: #fff; }
a { color: #6aa8ff; }
a:hover { color: var(--accent-2); }
:focus-visible { outline: 2px solid var(--accent-2); box-shadow: 0 0 0 4px rgba(0, 225, 255, .2); }
* { scrollbar-width: thin; scrollbar-color: #22365f transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #1b2b4f; border-radius: 10px; border: 2px solid var(--paper); }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

h1, h2, h3 { font-family: var(--display); letter-spacing: -0.02em; }
.eyebrow { color: var(--accent-2); letter-spacing: .18em; text-shadow: 0 0 12px rgba(0, 225, 255, .45); }
.muted, .lede { color: var(--muted); }
.mark {
  background: none; color: transparent;
  background-image: var(--grad); -webkit-background-clip: text; background-clip: text;
  text-shadow: none; filter: drop-shadow(0 0 18px rgba(0, 225, 255, .35));
}

/* ---------- barre du haut ---------- */
.top { background: rgba(3, 5, 11, .72); border-bottom: 1px solid transparent; backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent) 30%, var(--accent-2) 70%, transparent); opacity: .7; }
.brand { letter-spacing: -.01em; }
.brand::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 9px; border-radius: 2px; background: var(--grad); box-shadow: 0 0 12px var(--accent-2); transform: rotate(45deg) translateY(-2px); animation: pulse 2.6s ease-in-out infinite; }
.brand small { color: var(--muted); letter-spacing: .16em; }
.meter, .bar, .epochs div { background: rgba(59, 130, 255, .12); }
.meter > i, .bar > i, .epochs i { background: var(--grad); box-shadow: 0 0 12px rgba(0, 225, 255, .55); }
.bar.cov > i { background: repeating-linear-gradient(45deg, var(--accent-2), var(--accent-2) 4px, rgba(0, 225, 255, .35) 4px, rgba(0, 225, 255, .35) 8px); box-shadow: 0 0 10px rgba(0, 225, 255, .4); }

/* ---------- héros cinématographique ---------- */
.hero h1 {
  font-size: clamp(36px, 6.4vw, 68px); line-height: 1.02; font-weight: 700;
  background: linear-gradient(180deg, #ffffff 0%, #cfe0ff 55%, #7fa9ff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 40px rgba(59, 130, 255, .25);
}
.hero h1 .mark { display: inline; }
.hero > div:first-child { animation: rise .9s cubic-bezier(.2, .7, .1, 1) both; }
.hero .resume { animation: rise .9s .12s cubic-bezier(.2, .7, .1, 1) both; }
.resume .big {
  font-family: var(--display); font-weight: 700; font-size: 64px;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 16px rgba(0, 225, 255, .45));
}
.resume .big small { -webkit-text-fill-color: var(--muted); }

/* ---------- panneaux de verre ---------- */
.card, .viz, .table-wrap, .wk, .out, .cellbox, .json, .reveal, .continue {
  border-color: var(--line);
}
.card, .viz {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .025), rgba(255, 255, 255, 0) 40%),
    linear-gradient(180deg, rgba(14, 22, 44, .92), rgba(8, 13, 27, .92));
  box-shadow: var(--shadow);
  border-radius: 16px;
  position: relative;
}
.card::before, .viz::before {
  content: ""; position: absolute; left: 16px; right: 16px; top: -1px; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(0, 225, 255, .55), transparent); opacity: .55;
}
a.card, .mod, .wk, .stat, .continue { transition: transform .25s cubic-bezier(.2, .7, .1, 1), border-color .25s, box-shadow .25s; }
a.card:hover, .mod:hover, .wk:hover, .continue:hover { transform: translateY(-3px); border-color: rgba(59, 130, 255, .7); box-shadow: var(--shadow), var(--glow); }
.stat b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
.stats .card { animation: rise .8s cubic-bezier(.2, .7, .1, 1) both; }
.stats .card:nth-child(2) { animation-delay: .06s; } .stats .card:nth-child(3) { animation-delay: .12s; } .stats .card:nth-child(4) { animation-delay: .18s; }
.modules .mod { animation: rise .7s cubic-bezier(.2, .7, .1, 1) both; }
.modules .mod:nth-child(2) { animation-delay: .05s; } .modules .mod:nth-child(3) { animation-delay: .1s; } .modules .mod:nth-child(4) { animation-delay: .15s; }
.modules .mod:nth-child(5) { animation-delay: .2s; } .modules .mod:nth-child(6) { animation-delay: .25s; } .modules .mod:nth-child(n+7) { animation-delay: .3s; }
.mod b { font-weight: 700; }
.continue { background: linear-gradient(120deg, rgba(59, 130, 255, .14), rgba(0, 225, 255, .05)); border: 1px solid rgba(59, 130, 255, .45); border-style: solid; }
.continue b { color: #fff; }

/* ---------- boutons ---------- */
.btn { background: rgba(10, 16, 32, .8); border-color: var(--line); border-radius: 10px; transition: border-color .2s, box-shadow .2s, transform .08s, background .2s; }
.btn:hover { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(59, 130, 255, .25), 0 0 18px rgba(59, 130, 255, .25); }
.btn.primary, .done-btn.on {
  background: var(--grad); border-color: transparent; color: #020611; font-weight: 700;
  box-shadow: 0 0 0 1px rgba(0, 225, 255, .35), 0 6px 24px rgba(59, 130, 255, .45);
}
.btn.primary:hover { filter: brightness(1.12); box-shadow: 0 0 0 1px rgba(0, 225, 255, .6), 0 8px 32px rgba(0, 225, 255, .45); }
.done-btn.on { background: linear-gradient(100deg, #00c389, #00f0a0); }
.tabs button { background: rgba(10, 16, 32, .8); border-color: var(--line); color: var(--muted); transition: all .2s; }
.tabs button:hover { color: var(--ink); border-color: var(--accent); }
.tabs button[aria-selected="true"] { background: var(--grad); color: #020611; border-color: transparent; box-shadow: 0 0 20px rgba(0, 225, 255, .35); }
.jday input, .ask textarea { background: var(--code-bg); border-color: var(--line); color: var(--ink); }

/* ---------- plan des semaines ---------- */
.wk { background: linear-gradient(180deg, rgba(14, 22, 44, .9), rgba(8, 13, 27, .9)); }
.wk .n { color: var(--accent-2); }
.wk.cur { border-color: var(--accent-2); box-shadow: 0 0 0 1px rgba(0, 225, 255, .5), 0 0 26px rgba(0, 225, 255, .25); }

/* ---------- badges ---------- */
.badge { background: rgba(5, 9, 19, .8); }
.badge.ok { color: var(--ok); border-color: rgba(0, 240, 160, .35); box-shadow: 0 0 10px rgba(0, 240, 160, .12); }
.badge.local { color: var(--accent-2); border-color: rgba(0, 225, 255, .35); }
.badge.jedha { color: #7fb0ff; border-color: rgba(59, 130, 255, .45); }
.dot.done { box-shadow: 0 0 8px var(--ok); }
.dot.half { border-color: var(--accent-2); background: linear-gradient(90deg, var(--accent-2) 50%, transparent 50%); }

/* ---------- pages ---------- */
#app > * { animation: enter .55s cubic-bezier(.2, .7, .1, 1) both; }
.pagehead h1 { font-weight: 700; background: linear-gradient(180deg, #fff, #9cbcff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.prose h2 { font-weight: 700; position: relative; padding-left: 16px; }
.prose h2::before { content: ""; position: absolute; left: 0; top: .2em; bottom: .2em; width: 3px; border-radius: 3px; background: var(--grad); box-shadow: 0 0 12px var(--accent-2); }
.prose code { background: rgba(59, 130, 255, .1); border-color: rgba(59, 130, 255, .25); color: #cfe0ff; }
.prose strong { color: #fff; }
.callout { border-left: 3px solid var(--accent-2); background: linear-gradient(90deg, rgba(0, 225, 255, .1), rgba(59, 130, 255, .03)); box-shadow: -8px 0 24px -12px rgba(0, 225, 255, .6); }
.table-wrap { background: rgba(8, 13, 27, .85); }
.table-wrap th { background: rgba(59, 130, 255, .1); color: #cfe0ff; }
.section-t, .section-h h2 { font-weight: 700; }

/* ---------- cellules de code : terminal ---------- */
.cellbox { background: #040710; border-color: #15213f; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .02); transition: border-color .2s, box-shadow .2s; }
.cellbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(59, 130, 255, .35), 0 0 30px rgba(59, 130, 255, .2); }
.cellbar { background: rgba(10, 16, 32, .95); border-top-color: #15213f; }
.gut { color: var(--accent-2); text-shadow: 0 0 10px rgba(0, 225, 255, .5); }
.ed textarea { caret-color: var(--accent-2); }
.out { background: rgba(5, 9, 19, .9); border-color: #15213f; }
.verdict.ok { background: rgba(0, 240, 160, .08); border-color: rgba(0, 240, 160, .4); color: var(--ok); box-shadow: 0 0 22px rgba(0, 240, 160, .15); animation: rise .4s ease both; }
.verdict.no { background: rgba(255, 77, 109, .08); border-color: rgba(255, 77, 109, .4); color: var(--err); }
.status.ok { background: rgba(0, 240, 160, .1); box-shadow: 0 0 12px rgba(0, 240, 160, .2); }
.spin { border-top-color: var(--accent-2); box-shadow: 0 0 10px rgba(0, 225, 255, .4); }

/* ---------- animations interactives ---------- */
.viz-h { background: linear-gradient(90deg, rgba(59, 130, 255, .14), rgba(0, 225, 255, .03)); border-bottom-color: var(--line); }
.viz-h b { font-weight: 700; }
.viz-b svg { filter: drop-shadow(0 0 1px rgba(0, 225, 255, .15)); }
.vz-accent { filter: drop-shadow(0 0 3px rgba(59, 130, 255, .35)); }
.viz-c { border-top-color: var(--line); }
.viz-c input[type=range], .q input, .tasks input { accent-color: var(--accent-2); }
.json { background: #040710; border-color: #15213f; }

/* ---------- quiz, tuteur ---------- */
.score b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.q label.right { box-shadow: 0 0 16px rgba(0, 240, 160, .15); }
.msg.me { background: linear-gradient(120deg, rgba(59, 130, 255, .22), rgba(0, 225, 255, .08)); border: 1px solid rgba(59, 130, 255, .35); }
.msg.ai { background: #050913; }

/* ---------- écran de chargement ---------- */
.boot { font-family: var(--mono); letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--accent-2); text-shadow: 0 0 14px rgba(0, 225, 255, .6); animation: flicker 1.6s infinite; }
.boot::before { content: ""; display: block; width: 180px; height: 2px; margin: 0 auto 18px; background: var(--grad); box-shadow: 0 0 14px var(--accent-2); animation: load 1.4s ease-in-out infinite; transform-origin: left; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 6px var(--accent-2); } 50% { box-shadow: 0 0 16px var(--accent-2), 0 0 30px var(--accent); } }
@keyframes flicker { 0%, 100% { opacity: 1; } 48% { opacity: .85; } 50% { opacity: .4; } 52% { opacity: .9; } }
@keyframes load { 0% { transform: scaleX(0); } 60% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }
@media (max-width: 760px) { .resume .big { font-size: 54px; } body::after { display: none; } }
@media (prefers-reduced-motion: reduce) { #app > *, .hero > div, .stats .card, .modules .mod { animation: none !important; } }

/* ---------- carte de progression : halo et balayage ---------- */
.hero .resume {
  overflow: hidden;
  background:
    radial-gradient(420px 260px at 85% 115%, rgba(0, 225, 255, .20), transparent 65%),
    radial-gradient(300px 200px at 0% 0%, rgba(59, 130, 255, .16), transparent 70%),
    linear-gradient(180deg, rgba(14, 22, 44, .92), rgba(8, 13, 27, .92));
}
.hero .resume::after {
  content: ""; position: absolute; left: 0; right: 0; height: 80px; top: -80px; pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(0, 225, 255, .07), transparent);
  animation: scan 6s linear infinite;
}
.hero .resume > * { position: relative; z-index: 1; }
@keyframes scan { to { transform: translateY(700px); } }
@media (prefers-reduced-motion: reduce) { .hero .resume::after { animation: none; display: none; } }

/* ---------- lecteur audio ---------- */
.needs-listen, .say { display: none !important; }
.can-listen .needs-listen, .has-tts .needs-listen { display: inline-flex !important; }
.can-listen .say, .has-tts .say { display: inline-flex !important; }
.speakable { position: relative; scroll-margin: 120px; transition: background .3s, box-shadow .3s; border-radius: 8px; }
.say {
  align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; margin: 0 8px 0 0;
  border-radius: 50%; border: 1px solid rgba(59, 130, 255, .45); background: rgba(10, 16, 32, .9);
  color: var(--accent-2); font-size: 10px; line-height: 1; cursor: pointer; vertical-align: .15em;
  opacity: .6; transition: opacity .2s, box-shadow .2s, transform .1s;
}
.say:hover, .say:focus-visible { opacity: 1; box-shadow: 0 0 14px rgba(0, 225, 255, .5); }
.say:active { transform: scale(.92); }
.prose h2 .say, .prose h3 .say { vertical-align: .35em; }
@media (min-width: 900px) {
  .prose > p > .say, .prose > h2 > .say, .prose > h3 > .say, .prose > h4 > .say, .prose > ul > li > .say, .prose > ol > li > .say, .prose > blockquote > .say, .prose > .callout > .say {
    position: absolute; left: -40px; top: .25em; margin: 0;
  }
  .prose > ul > li > .say, .prose > ol > li > .say { left: -64px; }
  .prose > h2 > .say { left: -40px; top: .3em; }
  .speakable:not(:hover):not(.reading) > .say { opacity: .35; }
}
.reading {
  background: linear-gradient(90deg, rgba(0, 225, 255, .12), rgba(59, 130, 255, .04) 70%, transparent);
  box-shadow: -14px 0 0 -10px var(--accent-2), 0 0 0 6px rgba(0, 225, 255, .05);
}
.reading > .say, .reading > td > .say { opacity: 1 !important; background: var(--grad); color: #020611; border-color: transparent; box-shadow: 0 0 16px rgba(0, 225, 255, .6); animation: pulse 1.6s ease-in-out infinite; }
.reader {
  position: fixed; left: 0; right: 0; margin: 0 auto; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 50;
  width: min(560px, calc(100% - 20px)); border-radius: 18px; overflow: hidden;
  background: rgba(6, 10, 22, .88); border: 1px solid rgba(59, 130, 255, .45);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .6), 0 0 30px rgba(59, 130, 255, .25);
  backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
  animation: rise .35s cubic-bezier(.2, .7, .1, 1) both;
}
.rd-track { height: 3px; background: rgba(59, 130, 255, .15); }
.rd-fill { display: block; height: 100%; width: 0; background: var(--grad); box-shadow: 0 0 10px var(--accent-2); transition: width .4s ease; }
.rd-in { display: flex; align-items: center; gap: 6px; padding: 8px 10px; }
.rd-btn { border: 1px solid var(--line); background: rgba(10, 16, 32, .9); color: var(--ink); border-radius: 12px; min-width: 40px; height: 40px; padding: 0 10px; font: 600 14px var(--mono); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.rd-btn:hover { border-color: var(--accent); box-shadow: 0 0 14px rgba(59, 130, 255, .3); }
.rd-btn.big { min-width: 48px; height: 48px; border-radius: 50%; background: var(--grad); color: #020611; border-color: transparent; font-size: 15px; box-shadow: 0 0 18px rgba(0, 225, 255, .4); }
.rd-pos { flex: 1; min-width: 0; font: 12px var(--mono); color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd-rate { color: var(--accent-2); }
.reading-on main { padding-bottom: 140px; }
@media (max-width: 420px) { .rd-btn { min-width: 36px; height: 38px; padding: 0 8px; } .rd-btn.big { min-width: 44px; height: 44px; } .rd-pos { font-size: 11px; } }

<body>
<header class="top">
  <div class="top-in">
    <a class="back" id="back" href="#accueil" hidden>← <span>Accueil</span></a>
    <a class="brand" id="brand" href="#accueil">Prépa AI<small>ESSENTIALS · FULLSTACK · LEAD</small></a>
    <div class="spacer"></div>
    <div class="pill tab" title="Progression globale"><div class="meter"><i id="gmeter" style="width:0%"></i></div><span id="gpct">0 %</span></div>
  </div>
</header>
<main id="app"><div class="boot">Chargement de ta plateforme…</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
/* ================================================================ visualisations interactives
   Chaque visualisation est une fonction (el) => void qui remplit un bloc .viz. */
const NS = "http://www.w3.org/2000/svg";
const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function svgEl(tag, attrs = {}, text) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; }
function vizShell(el, title, kind) {
  el.innerHTML = `<div class="viz-h"><b>${esc(title)}</b><span class="eyebrow">${esc(kind || "interactif")}</span></div><div class="viz-b"></div><div class="viz-c"></div><div class="viz-note"></div>`;
  return { body: $(".viz-b", el), ctrl: $(".viz-c", el), note: $(".viz-note", el) };
}
function rangeCtl(ctrl, id, lab, min, max, step, val, fmt = v => v) {
  const w = h(`<label for="${id}">${esc(lab)} <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output>${fmt(+val)}</output></label>`);
  const inp = $("input", w), out = $("output", w);
  inp.addEventListener("input", () => { out.textContent = fmt(+inp.value); });
  ctrl.appendChild(w);
  return inp;
}
function btnCtl(ctrl, txt, cls = "btn small") { const b = h(`<button type="button" class="${cls}">${esc(txt)}</button>`); ctrl.appendChild(b); return b; }
let vizUid = 0;
const VIZ = {};
function mountViz(el, name) {
  const f = VIZ[name];
  if (!f) { el.remove(); return; }
  try { f(el); } catch (e) { el.innerHTML = `<div class="viz-note">Cette animation n'a pas pu s'afficher.</div>`; }
}

/* ---------- POO : une classe, des objets ---------- */
VIZ.oop = el => {
  const { body, ctrl, note } = vizShell(el, "Une classe, plusieurs objets", "POO");
  const presets = [["Stylo", 1.5, 10], ["Cahier", 3.2, 1], ["Sac", 40, 1], ["Clavier", 49.9, 2], ["Lampe", 24, 1]];
  let k = 0;
  body.innerHTML = `<div class="vgrid"><div><p class="vcap">La classe (le plan)</p><pre class="json">class Article:
    tva = 0.20

    def __init__(self, nom, prix_ht, quantite):
        self.nom = nom
        self.prix_ht = prix_ht
        self.quantite = quantite

    def total_ttc(self):
        return prix_ht × quantite × (1 + tva)</pre></div><div><p class="vcap">Les objets (les exemplaires)</p><div class="objs"></div></div></div>`;
  const objs = $(".objs", body);
  const add = () => {
    if (k >= presets.length) { objs.innerHTML = ""; k = 0; }
    const [n, p, q] = presets[k++];
    const v = n.toLowerCase();
    objs.appendChild(h(`<div class="objcard"><b>${v}</b> = Article("${n}", ${p}, ${q})<br>nom = "${n}"<br>prix_ht = ${p}<br>quantite = ${q}<br>total_ttc() → <b>${(p * q * 1.2).toFixed(2)}</b></div>`));
    note.innerHTML = `Chaque objet a <b>ses propres valeurs</b> d'attributs, mais tous partagent les mêmes méthodes et l'attribut de classe <code>tva</code>. ${k} objet${k > 1 ? "s" : ""} créé${k > 1 ? "s" : ""}.`;
  };
  btnCtl(ctrl, "Créer un objet", "btn small primary").addEventListener("click", add);
  add(); add();
};

/* ---------- HTTP : requête et réponse ---------- */
VIZ.http = el => {
  const { body, ctrl, note } = vizShell(el, "Le cycle requête → réponse", "HTTP");
  const REQ = [
    { m: "GET", p: "/books/3", s: 200, t: "OK", j: { id: 3, titre: "Fondation", annee: 1951, note: { moyenne: 4.4 } } },
    { m: "GET", p: "/books/999", s: 404, t: "Not Found", j: { erreur: "Livre 999 introuvable" } },
    { m: "GET", p: "/secure", s: 401, t: "Unauthorized", j: { erreur: "Clé d'API manquante ou invalide" } },
    { m: "GET", p: "/flaky", s: 503, t: "Service Unavailable", j: { erreur: "Service indisponible" } },
  ];
  body.innerHTML = `<svg viewBox="0 0 600 150" role="img" aria-label="Animation d'une requête HTTP entre un client et un serveur"></svg><pre class="json" style="margin-top:10px"></pre>`;
  const svg = $("svg", body), pre = $("pre", body);
  const box = (x, label, sub) => { const g = svgEl("g"); g.append(svgEl("rect", { x, y: 35, width: 130, height: 80, rx: 12, class: "vz-code vz-line", "stroke-width": 1.5 }), svgEl("text", { x: x + 65, y: 70, "text-anchor": "middle", class: "vz-tb" }, label), svgEl("text", { x: x + 65, y: 90, "text-anchor": "middle", class: "vz-tm" }, sub)); svg.append(g); };
  box(10, "Ton code", "requests.get(...)"); box(460, "Serveur", "api.biblio.test");
  svg.append(svgEl("line", { x1: 140, y1: 60, x2: 460, y2: 60, class: "vz-line", "stroke-width": 2, "stroke-dasharray": "4 4" }), svgEl("line", { x1: 140, y1: 95, x2: 460, y2: 95, class: "vz-line", "stroke-width": 2, "stroke-dasharray": "4 4" }));
  const pk = svgEl("g"); const pr = svgEl("rect", { x: -60, y: -13, width: 120, height: 26, rx: 13, class: "vz-accent" }); const pt = svgEl("text", { x: 0, y: 5, "text-anchor": "middle", class: "vz-tc", style: "fill:var(--surface);font-weight:600" }, "");
  pk.append(pr, pt); pk.setAttribute("opacity", 0); svg.append(pk);
  let anim = 0;
  const move = (x0, x1, y, ms) => new Promise(res => { const t0 = performance.now(); const my = ++anim; const step = t => { if (my !== anim) return res(); const u = Math.min(1, (t - t0) / ms); const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; pk.setAttribute("transform", `translate(${x0 + (x1 - x0) * e},${y})`); u < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });
  async function send(r) {
    pre.textContent = "…";
    pk.setAttribute("opacity", 1); pr.setAttribute("class", "vz-accent"); pt.textContent = `${r.m} ${r.p}`;
    const fast = reduceMotion();
    await move(200, 400, 60, fast ? 1 : 900);
    pr.setAttribute("class", r.s < 300 ? "vz-ok" : "vz-err"); pt.textContent = `${r.s} ${r.t}`;
    await move(400, 200, 95, fast ? 1 : 900);
    pk.setAttribute("opacity", 0);
    pre.textContent = `HTTP ${r.s} ${r.t}\nContent-Type: application/json\n\n${JSON.stringify(r.j, null, 2)}`;
    note.innerHTML = r.s < 300 ? "<b>2xx</b> : succès, le corps contient les données demandées." : r.s === 404 ? "<b>404</b> : la ressource n'existe pas. Réessayer ne sert à rien : corrige l'identifiant." : r.s === 401 ? "<b>401</b> : il manque une clé d'API valide dans l'en-tête Authorization." : "<b>503</b> : erreur temporaire du serveur. On attend un peu, puis on réessaie (backoff exponentiel).";
  }
  REQ.forEach((r, i) => btnCtl(ctrl, `${r.m} ${r.p}`, i ? "btn small" : "btn small primary").addEventListener("click", () => send(r)));
  pre.textContent = "Choisis une requête ci-dessous.";
  note.innerHTML = "Une requête part avec une <b>méthode</b> et un <b>chemin</b>, la réponse revient avec un <b>code de statut</b> et un corps JSON.";
};

/* ---------- groupby : découper, appliquer, combiner ---------- */
VIZ.groupby = el => {
  const { body, ctrl, note } = vizShell(el, "Découper → appliquer → combiner", "GROUP BY");
  const rows = [["Bastille", 12], ["Part-Dieu", 8], ["Bastille", 5], ["Chartrons", 9], ["Part-Dieu", 14], ["Bastille", 7], ["Chartrons", 3], ["Part-Dieu", 6]];
  const groups = [...new Set(rows.map(r => r[0]))];
  const AGG = { sum: ["SUM", a => a.reduce((x, y) => x + y, 0)], mean: ["AVG", a => +(a.reduce((x, y) => x + y, 0) / a.length).toFixed(2)], count: ["COUNT", a => a.length], max: ["MAX", a => Math.max(...a)] };
  let agg = "sum", step = 0;
  const draw = () => {
    const [fname, f] = AGG[agg];
    const table = (rs, colored) => `<table class="vtab"><tr><th>magasin</th><th>montant</th></tr>${rs.map(r => `<tr class="${colored ? "" : ""}"><td class="${colored ? "gcolor-" + groups.indexOf(r[0]) : ""}">${r[0]}</td><td class="${colored ? "gcolor-" + groups.indexOf(r[0]) : ""}">${r[1]}</td></tr>`).join("")}</table>`;
    let left = `<p class="vcap">Données</p>${table(rows, step >= 1)}`, right = "";
    if (step >= 1) right = `<p class="vcap">1 · Découper en groupes</p>${groups.map(g => `<div style="margin-bottom:8px">${table(rows.filter(r => r[0] === g), true)}${step >= 2 ? `<div class="vz-tc" style="font:600 12px var(--mono);padding:4px 8px">${fname}(montant) = ${f(rows.filter(r => r[0] === g).map(r => r[1]))}</div>` : ""}</div>`).join("")}`;
    if (step >= 3) left = `<p class="vcap">3 · Combiner</p><table class="vtab"><tr><th>magasin</th><th>${fname.toLowerCase()}_montant</th></tr>${groups.map(g => `<tr><td class="gcolor-${groups.indexOf(g)}">${g}</td><td class="gcolor-${groups.indexOf(g)}">${f(rows.filter(r => r[0] === g).map(r => r[1]))}</td></tr>`).join("")}</table><p class="vcap" style="margin-top:14px">Données</p>${table(rows, true)}`;
    body.innerHTML = `<div class="vgrid"><div>${left}</div><div>${right || '<p class="vcap">Clique sur « Étape suivante »</p>'}</div></div>`;
    note.innerHTML = [`En pandas : <code>df.groupby("magasin")["montant"].${agg === "count" ? "count" : agg}()</code>. En SQL : <code>SELECT magasin, ${fname}(montant) FROM t GROUP BY magasin</code>.`,
      "<b>Découper</b> : chaque ligne rejoint le groupe de son magasin.", `<b>Appliquer</b> : la fonction ${fname} est calculée dans chaque groupe, séparément.`, "<b>Combiner</b> : une ligne par groupe dans le résultat."][step];
  };
  btnCtl(ctrl, "Étape suivante", "btn small primary").addEventListener("click", () => { step = (step + 1) % 4; draw(); });
  const sel = h(`<label for="gb-agg-${++vizUid}">Fonction <select id="gb-agg-${vizUid}" class="btn small"><option value="sum">somme</option><option value="mean">moyenne</option><option value="count">comptage</option><option value="max">maximum</option></select></label>`);
  ctrl.appendChild(sel);
  $("select", sel).addEventListener("change", e => { agg = e.target.value; draw(); });
  draw();
};

/* ---------- jointures SQL ---------- */
VIZ.join = el => {
  const { body, ctrl, note } = vizShell(el, "INNER JOIN contre LEFT JOIN", "SQL");
  const clients = [[1, "Léa"], [2, "Hugo"], [3, "Inès"], [4, "Adam"]];
  const cmds = [[101, 1, "Bastille"], [102, 3, "Bouffay"], [103, 1, "Chartrons"], [104, 3, "Bastille"], [105, 2, "Part-Dieu"]];
  let mode = "INNER";
  const draw = () => {
    const res = [];
    for (const [id, p] of clients) {
      const m = cmds.filter(c => c[1] === id);
      if (m.length) m.forEach(c => res.push([id, p, c[0], c[2]]));
      else if (mode === "LEFT") res.push([id, p, null, null]);
    }
    const venn = `<svg viewBox="0 0 200 110" style="max-width:220px"><circle cx="80" cy="55" r="44" class="${mode === "LEFT" ? "vz-accent" : "vz-code"}" fill-opacity="${mode === "LEFT" ? .35 : 1}" stroke="var(--line)"/><circle cx="125" cy="55" r="44" class="vz-code" fill-opacity=".6" stroke="var(--line)"/><path d="M102.5 17 A44 44 0 0 1 102.5 93 A44 44 0 0 1 102.5 17" class="vz-accent" fill-opacity=".7"/><text x="62" y="58" class="vz-tm" text-anchor="middle">clients</text><text x="146" y="58" class="vz-tm" text-anchor="middle">commandes</text></svg>`;
    body.innerHTML = `<div class="vgrid"><div><p class="vcap">clients</p><table class="vtab"><tr><th>id</th><th>prenom</th></tr>${clients.map(([i, p]) => `<tr class="${cmds.some(c => c[1] === i) ? "" : (mode === "INNER" ? "dim" : "hl")}"><td>${i}</td><td>${p}</td></tr>`).join("")}</table><p class="vcap" style="margin-top:12px">commandes</p><table class="vtab"><tr><th>id</th><th>client_id</th><th>magasin</th></tr>${cmds.map(c => `<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td></tr>`).join("")}</table></div>
      <div>${venn}<p class="vcap">Résultat · ${res.length} lignes</p><table class="vtab"><tr><th>id</th><th>prenom</th><th>cmd</th><th>magasin</th></tr>${res.map(r => `<tr class="${r[2] === null ? "hl" : ""}">${r.map(v => v === null ? `<td class="null">NULL</td>` : `<td>${v}</td>`).join("")}</tr>`).join("")}</table></div></div>`;
    note.innerHTML = mode === "INNER" ? "<b>INNER JOIN</b> ne garde que les lignes qui ont une correspondance des deux côtés : Adam, qui n'a jamais commandé, disparaît." : "<b>LEFT JOIN</b> garde tous les clients. Adam apparaît avec des <b>NULL</b> : c'est ainsi qu'on trouve « ceux qui n'ont jamais commandé » (<code>WHERE c.id IS NULL</code>).";
    $$("button", ctrl).forEach(b => b.classList.toggle("primary", b.textContent.startsWith(mode)));
  };
  ["INNER JOIN", "LEFT JOIN"].forEach(t => btnCtl(ctrl, t).addEventListener("click", () => { mode = t.split(" ")[0]; draw(); }));
  draw();
};

/* ---------- ETL ---------- */
VIZ.etl = el => {
  const { body, ctrl, note } = vizShell(el, "Un pipeline ETL", "données");
  const st = [["Extract", "API /books", "23 livres JSON"], ["Transform", "pandas", "aplatir, renommer, typer"], ["Load", "SQLite / RDS", "table livres"]];
  body.innerHTML = `<svg viewBox="0 0 600 140" role="img" aria-label="Pipeline extraire, transformer, charger"></svg>`;
  const svg = $("svg", body);
  st.forEach(([t, s, d], i) => { const x = 20 + i * 200; svg.append(svgEl("rect", { x, y: 30, width: 160, height: 80, rx: 12, class: "vz-code vz-line", "stroke-width": 1.5, id: `etl${i}-${vizUid}` }), svgEl("text", { x: x + 80, y: 60, "text-anchor": "middle", class: "vz-tb" }, t), svgEl("text", { x: x + 80, y: 78, "text-anchor": "middle", class: "vz-tm" }, s), svgEl("text", { x: x + 80, y: 96, "text-anchor": "middle", class: "vz-tm" }, d)); if (i < 2) svg.append(svgEl("path", { d: `M${x + 165} 70 L${x + 195} 70`, class: "vz-smuted", "stroke-width": 2, "marker-end": "" }), svgEl("text", { x: x + 180, y: 64, "text-anchor": "middle", class: "vz-tm" }, "→")); });
  const dots = [];
  for (let i = 0; i < 12; i++) { const c = svgEl("circle", { r: 4, cx: 20, cy: 70, class: "vz-accent", opacity: 0 }); svg.append(c); dots.push(c); }
  const id = vizUid++;
  btnCtl(ctrl, "Lancer le pipeline", "btn small primary").addEventListener("click", () => {
    const t0 = performance.now();
    const run = t => {
      const el2 = (t - t0) / 1000;
      dots.forEach((d, i) => { const u = Math.max(0, Math.min(1, (el2 - i * 0.15) / 2.2)); d.setAttribute("opacity", u > 0 && u < 1 ? 1 : 0); d.setAttribute("cx", 100 + u * 400); d.setAttribute("cy", 70 + Math.sin(u * 12 + i) * 18 * (1 - u)); d.setAttribute("class", u > .5 ? "vz-ok" : "vz-accent"); });
      const stage = Math.min(2, Math.floor(el2 / 1.1));
      note.innerHTML = ["<b>Extraire</b> : on pagine l'API et on récupère le JSON brut.", "<b>Transformer</b> : on aplatit, on renomme les colonnes, on valide les types et les valeurs.", "<b>Charger</b> : on écrit la table dans la base, en remplaçant l'ancienne version (idempotence)."][stage];
      if (el2 < 4.2 && !reduceMotion()) requestAnimationFrame(run); else { dots.forEach(d => d.setAttribute("opacity", 0)); note.innerHTML = "Terminé : <b>23 lignes</b> chargées. Relancer le pipeline donne le même résultat, sans doublons."; }
    };
    requestAnimationFrame(run);
  });
  note.innerHTML = "Chaque étape est une fonction. Un orchestrateur comme <b>Airflow</b> en fera des tâches planifiées et surveillées.";
};

/* ---------- loi normale ---------- */
VIZ.normal = el => {
  const { body, ctrl, note } = vizShell(el, "La loi normale", "distribution");
  body.innerHTML = `<svg viewBox="0 0 600 240" role="img" aria-label="Courbe de la loi normale avec un histogramme d'échantillons"></svg>`;
  const svg = $("svg", body);
  const mu = rangeCtl(ctrl, `mu${++vizUid}`, "Moyenne μ", 140, 200, 1, 170);
  const sg = rangeCtl(ctrl, `sg${vizUid}`, "Écart-type σ", 3, 20, 1, 10);
  const drawBtn = btnCtl(ctrl, "Tirer 500 valeurs", "btn small primary");
  let sample = [];
  const X0 = 110, X1 = 230, W = 560, H = 190, L = 20, T = 20;
  const sx = x => L + (x - X0) / (X1 - X0) * W;
  const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const draw = () => {
    const m = +mu.value, s = +sg.value;
    svg.innerHTML = "";
    const pdf = x => Math.exp(-((x - m) ** 2) / (2 * s * s)) / (s * Math.sqrt(2 * Math.PI));
    const ymax = pdf(m) * 1.15;
    const sy = y => T + H - y / ymax * H;
    svg.append(svgEl("line", { x1: L, x2: L + W, y1: T + H, y2: T + H, class: "vz-line" }));
    for (let x = 110; x <= 230; x += 20) svg.append(svgEl("text", { x: sx(x), y: T + H + 16, "text-anchor": "middle", class: "vz-tm" }, x));

VIZ.gradient = el => {
  const { body, ctrl, note } = vizShell(el, "La descente de gradient pas à pas", "optimisation");

  const L = 40, W = 520, T = 15, H = 210, XA = -7, XB = 13, YB = 110;
  const sx = x => L + (x - XA) / (XB - XA) * W, sy = y => T + H - Math.min(y, YB) / YB * H;
  let path = [], k = 0, timer = null;
  const base = () => {
    svg.innerHTML = "";

    svg.append(svgEl("path", { d, fill: "none", class: "vz-smuted", "stroke-width": 2 }));
    svg.append(svgEl("text", { x: sx(3), y: T + H + 34, "text-anchor": "middle", class: "vz-tm" }, "minimum : x = 3"));
  };
  const drawPath = () => {
    base();
    for (let i = 0; i <= k && i < path.length; i++) {
      const x = path[i];
      if (i > 0) { const p = path[i - 1]; svg.append(svgEl("line", { x1: sx(p), y1: sy(f(p)), x2: sx(x), y2: sy(f(x)), class: "vz-sacc", "stroke-width": 1.5, "stroke-opacity": .6 })); }
      svg.append(svgEl("circle", { cx: sx(Math.max(XA, Math.min(XB, x))), cy: sy(f(x)), r: i === k ? 7 : 4, class: i === k ? "vz-mark" : "vz-accent", stroke: "var(--ink)", "stroke-width": i === k ? 1.5 : 0 }));

  };

/* ---------- sous- et sur-apprentissage ---------- */
VIZ.overfit = el => {
  const { body, ctrl, note } = vizShell(el, "Trop simple, juste bien, trop complexe", "biais-variance");
  body.innerHTML = `<div class="vgrid"><div><svg viewBox="0 0 300 220" class="fit" role="img" aria-label="Ajustement polynomial"></svg></div><div><svg viewBox="0 0 300 220" class="err" role="img" aria-label="Erreurs d'entraînement et de test selon le degré"></svg></div></div>`;
  const deg = rangeCtl(ctrl, `dg${++vizUid}`, "Complexité (degré)", 1, 12, 1, 3);
  let s = 7; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const g = x => Math.sin(2.6 * x) + 0.3 * x;
  const mk = (n, off) => Array.from({ length: n }, (_, i) => { const x = -1 + 2 * (i + off) / n; return [x, g(x) + (r() - .5) * 0.7]; });
  const train = mk(14, 0.2), test = mk(14, 0.7);
  function fit(pts, d) {
    const m = d + 1, A = Array.from({ length: m }, () => Array(m + 1).fill(0));
    for (const [x, y] of pts) { const p = Array.from({ length: m }, (_, k) => x ** k); for (let i = 0; i < m; i++) { for (let j = 0; j < m; j++) A[i][j] += p[i] * p[j]; A[i][m] += p[i] * y; } }
    for (let i = 0; i < m; i++) A[i][i] += 1e-7;
    for (let i = 0; i < m; i++) { let piv = i; for (let k = i + 1; k < m; k++) if (Math.abs(A[k][i]) > Math.abs(A[piv][i])) piv = k; [A[i], A[piv]] = [A[piv], A[i]]; for (let k = 0; k < m; k++) if (k !== i) { const f = A[k][i] / A[i][i]; for (let j = i; j <= m; j++) A[k][j] -= f * A[i][j]; } }
    const c = A.map((row, i) => row[m] / row[i]);
    return x => c.reduce((a, ci, k) => a + ci * x ** k, 0);
  }
  const mse = (p, pts) => pts.reduce((a, [x, y]) => a + (p(x) - y) ** 2, 0) / pts.length;
  const curves = Array.from({ length: 12 }, (_, i) => { const p = fit(train, i + 1); return [mse(p, train), mse(p, test), p]; });
  const draw = () => {
    const d = +deg.value, [tr, te, p] = curves[d - 1];
    const sf = $("svg.fit", body); sf.innerHTML = "";
    const X = x => 20 + (x + 1) / 2 * 260, Y = y => 110 - y * 55;
    sf.append(svgEl("text", { x: 20, y: 14, class: "vz-tm" }, `degré ${d}`));
    let path = ""; for (let x = -1; x <= 1.0001; x += .01) { const y = Math.max(-1.9, Math.min(1.9, p(x))); path += `${path ? "L" : "M"}${X(x)} ${Y(y)} `; }
    sf.append(svgEl("path", { d: path, fill: "none", class: "vz-sacc", "stroke-width": 2.2 }));
    train.forEach(([x, y]) => sf.append(svgEl("circle", { cx: X(x), cy: Y(y), r: 4, class: "vz-accent" })));
    test.forEach(([x, y]) => sf.append(svgEl("rect", { x: X(x) - 4, y: Y(y) - 4, width: 8, height: 8, class: "vz-mark", stroke: "var(--ink)", "stroke-width": 1 })));
    sf.append(svgEl("text", { x: 20, y: 212, class: "vz-tm" }, "● entraînement   ■ test"));
    const se = $("svg.err", body); se.innerHTML = "";
    const ymax = .6, EX = i => 30 + (i - 1) / 11 * 250, EY = v => 190 - Math.min(v, ymax) / ymax * 170;
    se.append(svgEl("line", { x1: 30, x2: 280, y1: 190, y2: 190, class: "vz-line" }));
    [[0, "vz-sacc", "entraînement"], [1, "vz-serr", "test"]].forEach(([k, c, lab], j) => { let pth = ""; curves.forEach((cv, i) => { pth += `${pth ? "L" : "M"}${EX(i + 1)} ${EY(cv[k])} `; }); se.append(svgEl("path", { d: pth, fill: "none", class: c, "stroke-width": 2 }), svgEl("text", { x: 190, y: 20 + j * 16, style: `font:600 11px var(--mono);fill:var(--${k ? "err" : "accent"})` }, "── " + lab)); });
    se.append(svgEl("line", { x1: EX(d), x2: EX(d), y1: 10, y2: 190, class: "vz-smuted", "stroke-dasharray": "3 3" }));
    se.append(svgEl("text", { x: 30, y: 206, class: "vz-tm" }, "erreur (MSE) selon le degré, de 1 à 12"));
    note.innerHTML = `Erreur d'entraînement <b>${tr.toFixed(3)}</b>, erreur de test <b>${te.toFixed(3)}</b>. ` + (d <= 2 ? "Le modèle est <b>trop simple</b> : il se trompe partout (sous-apprentissage)." : d >= 8 ? "Le modèle colle aux points d'entraînement, bruit compris, et se trompe sur le test : <b>surapprentissage</b>." : "Bon compromis : l'erreur de test est proche de son minimum.");
  };
  deg.addEventListener("input", draw); draw();
};

  const qs = [["Comment régler le learning rate ?", [.92, .38]], ["Fusionner deux tables ?", [-.55, .85]], ["Déployer mon modèle ?", [.05, -.98]]];

    svg.append(svgEl("rect", { x: qv[0] - .06, y: -qv[1] - .06, width: .12, height: .12, class: "vz-mark", stroke: "var(--ink)", "stroke-width": .015 }));

    note.innerHTML = "Chaque texte devient un <b>vecteur</b> (embedding). La question (carré jaune) est comparée à tous les documents par <b>similarité cosinus</b> ; les <b>k</b> plus proches sont ajoutés au prompt.";

/* ---------- BPE ---------- */
VIZ.bpe = el => {
  const { body, ctrl, note } = vizShell(el, "Le découpage BPE, fusion par fusion", "tokens");
  const start = ["l o w", "l o w e r", "n e w e s t", "w i d e s t", "l o w e s t"];
  let corpus = start.slice(), merges = [];
  const step = () => {
    const c = new Map();
    corpus.forEach(m => { const s = m.split(" "); for (let i = 0; i < s.length - 1; i++) { const k = s[i] + " " + s[i + 1]; c.set(k, (c.get(k) || 0) + 1); } });
    if (!c.size) return false;
    let best = null; for (const [k, v] of c) if (!best || v > best[1]) best = [k, v];
    const [a, b] = best[0].split(" ");
    corpus = corpus.map(m => { const s = m.split(" "), o = []; for (let i = 0; i < s.length; i++) { if (i < s.length - 1 && s[i] === a && s[i + 1] === b) { o.push(a + b); i++; } else o.push(s[i]); } return o.join(" "); });
    merges.push(`${a} + ${b} → ${a + b} (${best[1]} fois)`);
    return true;

/* ---------- outils numériques partagés ---------- */
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function solve(A, b) { const n = b.length, M = A.map((row, i) => [...row, b[i]]); for (let i = 0; i < n; i++) { let p = i; for (let k = i + 1; k < n; k++) if (Math.abs(M[k][i]) > Math.abs(M[p][i])) p = k; [M[i], M[p]] = [M[p], M[i]]; for (let k = 0; k < n; k++) if (k !== i) { const f = M[k][i] / M[i][i]; for (let j = i; j <= n; j++) M[k][j] -= f * M[i][j]; } } return M.map((r, i) => r[n] / r[i]); }

/* ---------- Ridge contre Lasso ---------- */
VIZ.regpath = el => {
  const { body, ctrl, note } = vizShell(el, "Ridge contre Lasso : l'effet de α", "régularisation");
  const r = mulberry(11), n = 80, p = 8, vrai = [3, -2, 1.2, 0, 0, 0, 0, 0];
  const X = Array.from({ length: n }, () => Array.from({ length: p }, () => gauss(r)));
  X.forEach(x => { x[3] = x[0] * 0.7 + gauss(r) * 0.5; });                 // une variable inutile mais corrélée
  const y = X.map(x => x.reduce((a, v, j) => a + v * vrai[j], 0) + gauss(r) * 1.2);
  const XtX = Array.from({ length: p }, (_, i) => Array.from({ length: p }, (_, j) => X.reduce((a, x) => a + x[i] * x[j], 0)));
  const Xty = Array.from({ length: p }, (_, i) => X.reduce((a, x, k) => a + x[i] * y[k], 0));
  const ridge = a => solve(XtX.map((row, i) => row.map((v, j) => v + (i === j ? a : 0))), Xty);
  const lasso = a => { const w = Array(p).fill(0); for (let it = 0; it < 200; it++) for (let j = 0; j < p; j++) { let rho = 0; for (let k = 0; k < n; k++) { let pred = 0; for (let m = 0; m < p; m++) if (m !== j) pred += X[k][m] * w[m]; rho += X[k][j] * (y[k] - pred); } const z = XtX[j][j], t = a * n / 10; w[j] = rho > t ? (rho - t) / z : rho < -t ? (rho + t) / z : 0; } return w; };
  let mode = "Ridge";
  const la = rangeCtl(ctrl, `ra${++vizUid}`, "log₁₀ α", -2, 3, 0.1, 0, v => `α = ${(10 ** v).toPrecision(2)}`);
  ["Ridge", "Lasso"].forEach(m => btnCtl(ctrl, m).addEventListener("click", () => { mode = m; draw(); }));
  const draw = () => {
    const a = 10 ** +la.value, w = mode === "Ridge" ? ridge(a) : lasso(a);
    const W = 560, H = 200, mid = 110, sc = 28;
    let svg = `<svg viewBox="0 0 600 256"><line x1="30" x2="590" y1="${mid}" y2="${mid}" class="vz-line"/>`;
    w.forEach((v, j) => { const x = 50 + j * 68, hgt = Math.max(-95, Math.min(95, v * sc)); svg += `<rect x="${x}" width="26" y="${hgt > 0 ? mid - hgt : mid}" height="${Math.abs(hgt) || 1}" class="${Math.abs(v) < 1e-6 ? "vz-muted" : "vz-accent"}" rx="3"/><rect x="${x + 28}" width="8" y="${vrai[j] > 0 ? mid - vrai[j] * sc : mid}" height="${Math.abs(vrai[j] * sc) || 1}" class="vz-mark"/><text x="${x + 16}" y="228" text-anchor="middle" class="vz-tm">x${j}</text><text x="${x + 13}" y="${hgt >= 0 ? mid - hgt - 6 : mid - hgt + 14}" text-anchor="middle" class="vz-tm">${v.toFixed(2)}</text>`; });
    body.innerHTML = svg + `<text x="40" y="252" class="vz-tm">barres bleues : coefficients estimés · jaunes : vrais coefficients</text></svg>`;
    $$("button", ctrl).forEach(b => b.classList.toggle("primary", b.textContent === mode));
    const zeros = w.filter(v => Math.abs(v) < 1e-6).length;
    note.innerHTML = mode === "Ridge" ? `Ridge rétrécit <b>tous</b> les coefficients à mesure que α grandit, sans jamais les annuler. Seules x0, x1 et x2 comptent vraiment.` : `Lasso met <b>${zeros}</b> coefficient${zeros > 1 ? "s" : ""} à zéro : il sélectionne les variables. Trop fort, il finit par annuler aussi les variables utiles.`;
  };
  la.addEventListener("input", draw); draw();
};

/* ---------- arbre de décision en 2D ---------- */
VIZ.tree = el => {
  const { body, ctrl, note } = vizShell(el, "Un arbre découpe l'espace", "arbres");
  const r = mulberry(5), pts = [];
  for (let i = 0; i < 160; i++) { const a = r() * Math.PI, c = i % 2; const x = c ? 1 - Math.cos(a) : Math.cos(a), y = c ? 0.5 - Math.sin(a) : Math.sin(a); pts.push([x + gauss(r) * 0.18, y + gauss(r) * 0.18, c]); }
  const gini = s => { if (!s.length) return 0; const p = s.filter(q => q[2]).length / s.length; return 1 - p * p - (1 - p) * (1 - p); };
  function build(s, d, box) {
    const maj = s.filter(q => q[2]).length * 2 >= s.length ? 1 : 0;
    if (d === 0 || gini(s) === 0 || s.length < 4) return { leaf: true, c: maj, box, n: s.length };
    let best = null;
    for (const f of [0, 1]) { const vals = [...new Set(s.map(q => q[f]))].sort((a, b) => a - b); for (let i = 0; i < vals.length - 1; i += 2) { const t = (vals[i] + vals[i + 1]) / 2, L = s.filter(q => q[f] <= t), R = s.filter(q => q[f] > t), g = (L.length * gini(L) + R.length * gini(R)) / s.length; if (!best || g < best.g) best = { f, t, g, L, R }; } }
    if (!best) return { leaf: true, c: maj, box, n: s.length };
    const bl = box.slice(), br = box.slice(); if (best.f === 0) { bl[2] = best.t; br[0] = best.t; } else { bl[3] = best.t; br[1] = best.t; }
    return { f: best.f, t: best.t, l: build(best.L, d - 1, bl), r: build(best.R, d - 1, br) };
  }
  const predict = (nd, q) => nd.leaf ? nd.c : predict(q[nd.f] <= nd.t ? nd.l : nd.r, q);
  const leaves = nd => nd.leaf ? [nd] : [...leaves(nd.l), ...leaves(nd.r)];
  const depth = rangeCtl(ctrl, `td${++vizUid}`, "Profondeur max", 1, 10, 1, 2);
  const draw = () => {
    const tree = build(pts, +depth.value, [-1.6, -1.1, 2.6, 1.6]);
    const X = x => 20 + (x + 1.6) / 4.2 * 560, Y = y => 240 - (y + 1.1) / 2.7 * 230;
    let svg = `<svg viewBox="0 0 600 250">`;
    leaves(tree).forEach(lf => { const [x0, y0, x1, y1] = lf.box; svg += `<rect x="${X(x0)}" y="${Y(y1)}" width="${X(x1) - X(x0)}" height="${Y(y0) - Y(y1)}" class="${lf.c ? "vz-mark" : "vz-accent"}" fill-opacity=".16" stroke="var(--line)"/>`; });
    pts.forEach(q => { svg += q[2] ? `<rect x="${X(q[0]) - 4}" y="${Y(q[1]) - 4}" width="8" height="8" class="vz-mark" stroke="var(--ink)" stroke-width=".8"/>` : `<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="4" class="vz-accent"/>`; });
    body.innerHTML = svg + "</svg>";
    const acc = pts.filter(q => predict(tree, q) === q[2]).length / pts.length, nl = leaves(tree).length;
    note.innerHTML = `<b>${nl} feuilles</b> · exactitude sur ces points : <b>${(acc * 100).toFixed(0)}${" "}%</b>. ` + (+depth.value <= 2 ? "Peu profond : des frontières grossières, l'arbre sous-apprend." : +depth.value >= 7 ? "Très profond : l'arbre isole des points de bruit dans de minuscules rectangles. Il surapprend." : "Les coupes sont toujours parallèles aux axes : l'arbre approche la frontière courbe par des marches d'escalier.");
  };
  depth.addEventListener("input", draw); draw();
};

/* ---------- boosting pas à pas ---------- */
VIZ.boost = el => {
  const { body, ctrl, note } = vizShell(el, "Le boosting corrige ses erreurs", "boosting");
  const r = mulberry(3), N = 70, xs = Array.from({ length: N }, (_, i) => i / (N - 1) * 6).map(x => x + (r() - .5) * .05), ys = xs.map(x => Math.sin(x) * 3 + gauss(r) * 0.45);
  const mean = ys.reduce((a, b) => a + b, 0) / N;
  const stump = res => { let best = null; for (let i = 1; i < N; i++) { const t = (xs[i - 1] + xs[i]) / 2, L = res.slice(0, i), R = res.slice(i), ml = L.reduce((a, b) => a + b, 0) / L.length, mr = R.reduce((a, b) => a + b, 0) / R.length, e = L.reduce((a, v) => a + (v - ml) ** 2, 0) + R.reduce((a, v) => a + (v - mr) ** 2, 0); if (!best || e < best.e) best = { t, ml, mr, e }; } return x => x <= best.t ? best.ml : best.mr; };
  const it = rangeCtl(ctrl, `bi${++vizUid}`, "Nombre d'arbres", 0, 150, 1, 0);
  const eta = rangeCtl(ctrl, `be${vizUid}`, "Taux η", 0.05, 1, 0.05, 0.2, v => v.toFixed(2));
  let cache = {};
  const run = (m, e) => { const key = e; if (!cache[key]) { const preds = [ys.map(() => mean)]; let p = preds[0].slice(); for (let k = 0; k < 150; k++) { const h = stump(ys.map((v, i) => v - p[i])); p = p.map((v, i) => v + e * h(xs[i])); preds.push(p.slice()); } cache[key] = preds; } return cache[key][m]; };
  const draw = () => {
    const m = +it.value, e = +eta.value, p = run(m, e);
    const X = x => 20 + x / 6 * 560, Y = y => 120 - y * 30;
    let svg = `<svg viewBox="0 0 600 240"><line x1="20" x2="580" y1="120" y2="120" class="vz-line"/>`;
    xs.forEach((x, i) => { svg += `<line x1="${X(x)}" x2="${X(x)}" y1="${Y(ys[i])}" y2="${Y(p[i])}" class="vz-serr" stroke-opacity=".45"/><circle cx="${X(x)}" cy="${Y(ys[i])}" r="3.5" class="vz-accent"/>`; });
    svg += `<path d="${xs.map((x, i) => `${i ? "L" : "M"}${X(x)} ${Y(p[i])}`).join(" ")}" fill="none" class="vz-sink" stroke-width="2.2"/></svg>`;
    body.innerHTML = svg;
    const mse = ys.reduce((a, v, i) => a + (v - p[i]) ** 2, 0) / N;
    note.innerHTML = `Après <b>${m}</b> arbre${m > 1 ? "s" : ""} : MSE = <b>${mse.toFixed(3)}</b>. Les traits rouges sont les <b>résidus</b> : chaque nouvel arbre (une simple « marche ») apprend à les réduire. ` + (m === 0 ? "Au départ, on prédit la moyenne." : e > 0.6 ? "Avec un grand η, chaque arbre corrige brutalement : on risque de surapprendre." : "");
  };
  it.addEventListener("input", draw); eta.addEventListener("input", draw); draw();
};

/* ---------- K-means pas à pas ---------- */
VIZ.kmeans = el => {
  const { body, ctrl, note } = vizShell(el, "K-means, étape par étape", "clustering");
  const r = mulberry(21);
  const pts = []; [[-1.2, -0.6], [1.3, -0.4], [0.1, 1.2]].forEach(([cx, cy]) => { for (let i = 0; i < 45; i++) pts.push([cx + gauss(r) * 0.45, cy + gauss(r) * 0.45]); });
  let K = 3, centres, labels, phase, iter;
  const init = () => { const rr = mulberry(Math.floor(Math.random() * 1e6)); centres = Array.from({ length: K }, () => pts[Math.floor(rr() * pts.length)].slice()); labels = pts.map(() => -1); phase = "affecter"; iter = 0; draw(); };
